<title>Тахо — автовикторина</title>
<style>
:root{--deep:#0f1745;--yellow:#ffc400;--paper:#f5f6fa;--green:#22a559;--red:#e5322d;
--display:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",sans-serif;
--text:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;--snap:cubic-bezier(.2,.9,.25,1.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--deep)}
body{margin:0;min-height:100dvh;color:var(--paper);font-family:var(--text);touch-action:manipulation;
background:radial-gradient(120% 55% at 50% 0,#2e45b9 0,rgba(46,69,185,0) 70%),repeating-linear-gradient(-20deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),linear-gradient(#17236a,#0b1038)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
.app.leave{animation:leave .18s ease-in both}
@keyframes leave{to{opacity:0;transform:translateX(-26px)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{40%{transform:scale(1.03)}}

/* меню */
.hero{text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.gauge{width:220px;max-width:62%;display:block;margin:0 auto}
.needle{transform-origin:100px 110px;transform:rotate(40deg);animation:rev 1.2s var(--snap) both}
@keyframes rev{from{transform:rotate(-92deg)}60%{transform:rotate(55deg)}to{transform:rotate(40deg)}}
.word{font:italic 800 88px/.95 var(--display);color:var(--yellow);margin:0;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:up .5s .1s both}
.sub{margin:8px 0 0;font-size:15px;opacity:.8;animation:up .5s .2s both}
.modes{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);color:var(--deep);padding:13px 18px;border-left:8px solid var(--yellow);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);animation:up .45s var(--snap) both;animation-delay:calc(.25s + var(--i)*.06s)}
.mode:active{transform:scale(.97)}
.mode.mix{background:var(--yellow);border-left-color:var(--deep);padding:19px 18px}
.mode strong{display:block;font:italic 800 25px/1.05 var(--display)}
.mode.mix strong{font-size:33px}
.mode small{display:block;font-size:13.5px;opacity:.7;margin-top:2px}
.rec{font:italic 800 21px var(--display);text-align:right}
.rec small{font:500 12px var(--text);margin:0}
.note{font-size:12.5px;line-height:1.45;opacity:.6;margin:6px 4px 0}

/* шапка и счёт */
.bar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.meter{position:absolute;left:16px;right:64px;bottom:36px;z-index:2;display:flex;align-items:flex-end;gap:14px}
.flow{position:static;margin:0 -16px;padding-left:16px;padding-right:16px}
.meter.flow{padding:0;margin:0}
.back{width:40px;height:40px;font-size:30px;line-height:1;display:grid;place-items:center;padding-bottom:3px;background:rgba(10,15,50,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mt{flex:1;font:italic 800 22px/1 var(--display);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mt small{display:block;font:500 12px var(--text);opacity:.8;margin-top:3px}
.lives{display:flex;gap:6px}
.lives i{width:16px;height:16px;background:var(--yellow);transform:skewX(-20deg);transition:transform .35s,background .35s}
.lives i.gone{background:rgba(255,255,255,.25);transform:skewX(-20deg) scale(.6)}
.meter b{font:italic 800 66px/.85 var(--display);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.meter b.pop{animation:pop .45s var(--snap)}
@keyframes pop{40%{transform:scale(1.3);color:var(--yellow)}}
.tach{flex:1;display:flex;gap:4px;padding-bottom:4px}
.tach i{flex:1;height:10px;background:rgba(255,255,255,.22);transform:skewX(-20deg);transition:background .3s}
.tach i.on{background:var(--yellow)}.tach i.on.hot{background:var(--red)}
.tach i.last{animation:pulse .5s}

/* фото */
.shot{position:relative;margin:0 -16px;height:calc(env(safe-area-inset-top,0px) + min(66vw,340px));background:var(--deep);overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 46px) 100%,0 100%)}
.shot.sk{background:linear-gradient(100deg,#0f1745 30%,#2a3ea8 50%,#0f1745 70%) 0 0/250% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.shot img,.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;animation:imgin .7s ease-out both}
@keyframes imgin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.shot img.contain{object-fit:contain}
.bgb{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) brightness(.65)}
.shot::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(8,12,40,.6),transparent 30%,transparent 50%,rgba(8,12,40,.9))}
.fx{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none}
.shot.gl .fx{background:var(--green);animation:flash .6s ease-out}
.shot.rd .fx{background:var(--red);animation:flash .6s ease-out}
@keyframes flash{from{opacity:.6}to{opacity:0}}
.cap{position:absolute;left:16px;right:16px;bottom:92px;z-index:2;font:italic 800 29px/1.05 var(--display);text-shadow:0 2px 12px rgba(0,0,0,.7);animation:up .4s ease-out both}
.cap small{display:block;font:500 13px var(--text);margin-top:4px;opacity:.9}
.cap a{color:inherit}
.q{font:italic 800 27px/1.1 var(--display);margin:2px 0 0;animation:up .45s .08s ease-out both}
.q small{display:block;font:500 13px var(--text);opacity:.7;margin-top:4px}

/* ответы */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--paper);color:var(--deep);text-align:left;padding:14px 16px;font-size:17px;font-weight:600;border-left:6px solid var(--yellow);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);animation:up .4s ease-out both;animation-delay:calc(.12s + var(--i)*.06s);transition:transform .12s,opacity .3s,background .25s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--green);color:#fff;border-left-color:#fff;animation:pulse .45s}
.opt.bad{background:var(--red);color:#fff;border-left-color:#fff;animation:shake .4s}
.opt.dim{opacity:.45}

/* дуэль */
.duel{display:flex;flex-direction:column;gap:10px}
.dcard{position:relative;display:block;width:100%;height:clamp(150px,26dvh,225px);overflow:hidden;background:linear-gradient(120deg,#1a2680,#0f1745);text-align:left;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);animation:up .45s ease-out both;animation-delay:calc(.1s + var(--i)*.09s);transition:transform .12s,opacity .3s}
.dcard:active{transform:scale(.985)}
.dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,12,40,.1) 25%,rgba(8,12,40,.92))}
.dcard .edge{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--yellow);z-index:2;transition:background .3s}
.dcard.ok .edge{background:var(--green)}.dcard.bad .edge{background:var(--red)}.dcard.dim{opacity:.55}
.dcard.bad{animation:shake .4s}
.dcard .info{position:absolute;left:20px;right:16px;bottom:14px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dcard .nm{font:italic 800 25px/1.02 var(--display);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dcard .vr{display:block;font:500 13px var(--text);opacity:.8;margin-top:3px}
.dcard .hp{font:italic 800 34px/1 var(--display);white-space:nowrap}
.dcard .hp small{font:600 13px var(--text);opacity:.8;margin-left:3px}
.dcard .fill{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--yellow);z-index:3;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dcard.ok .fill{background:var(--green)}.dcard.bad .fill{background:var(--red)}

/* ползунок */
.guess{display:flex;flex-direction:column;gap:2px;animation:up .45s .1s ease-out both}
.read{font:italic 800 54px/1 var(--display);color:var(--yellow);text-align:center;transition:color .3s}
.read.ok{color:#5fe08f}.read.bad{color:#ff6b66}
.rw{position:relative;padding:34px 0 8px}
.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;margin:0;border-radius:0;background:linear-gradient(90deg,var(--yellow) var(--p,50%),rgba(255,255,255,.22) var(--p,50%));transform:skewX(-20deg)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:42px;background:var(--paper);border:0;border-left:7px solid var(--deep);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.rng::-moz-range-thumb{width:23px;height:42px;background:var(--paper);border:0;border-left:7px solid var(--deep);border-radius:0}
.rng:disabled{opacity:.8}
.lh{display:flex;justify-content:space-between;font-size:12px;opacity:.6;padding:6px 2px 0}
.mark{position:absolute;top:0;left:calc(15px + (100% - 30px)*var(--m));width:0;height:60px;animation:fade .4s .15s both}
.mark::before{content:"";position:absolute;left:-1.5px;top:22px;bottom:0;width:3px;background:var(--green)}
.mark span{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;background:var(--green);color:#fff;font:italic 800 17px var(--display);padding:2px 8px}

.fb{margin:0;font-size:17px;animation:up .4s both}
.nextbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:auto;padding-top:6px;animation:up .35s ease-out both}
.next{width:100%;background:var(--yellow);color:var(--deep);font:italic 800 25px var(--display);padding:15px;text-align:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.next:active{transform:scale(.98)}
.err{background:var(--deep);padding:18px;font-size:16px;line-height:1.45;margin-top:16px}

/* финиш */
.over{position:relative;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 40px);display:flex;flex-direction:column;gap:12px}
.over h2{font:italic 800 46px/1 var(--display);margin:0;color:var(--yellow);animation:up .5s both}
.over .big{font:italic 800 132px/1 var(--display);animation:up .5s .1s both}
.over p{margin:0;font-size:18px;opacity:.9;animation:up .5s .2s both}
.ghost{background:rgba(255,255,255,.12);text-align:center;padding:14px;font-size:17px;font-weight:600}
.cf{position:absolute;left:0;right:0;top:150px;height:0;pointer-events:none}
.cf i{position:absolute;width:8px;height:18px;animation:burst 1.2s ease-out var(--d) both}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

const CARS=RAW.map(([b,m,hp,v,k,p,x])=>({b,m,hp,v,p,k:k.split(" "),x:x?new RegExp(x):null,name:b+" "+m}));
const BRANDS=[...new Set(CARS.map(c=>c.b))];
const MODES={
 mix:{t:"Микс",d:"Все режимы вперемешку"},
 model:{t:"Угадай модель",d:"Фото и 4 варианта"},
 brand:{t:"Угадай марку",d:"Только марка, зато быстро"},
 power:{t:"Что мощнее",d:"Два авто, выбери мощнее"},
 rich:{t:"Кто дороже",d:"Два авто, выбери дороже"},
 gp:{t:"Угадай мощность",d:"Ползунок: сколько л.с."},
 gc:{t:"Угадай цену",d:"Ползунок: сколько стоила новой"}
};
const MIXK=["model","model","brand","power","rich","gp","gc"];
const G={
 gp:{f:"hp",min:100,max:1600,log:0,tol:.1,fmt:v=>v+" л.с.",ask:"Сколько л.с. у этой машины?"},
 gc:{f:"p",min:10000,max:3500000,log:1,tol:.2,fmt:v=>"$ "+grp(v),ask:"Сколько она стоила новой?"}
};
const grp=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");
const snapP=p=>{const st=p<50000?1000:p<200000?5000:p<1e6?10000:50000;return Math.round(p/st)*st};
const val=(g,t)=>{t=t/1000;return g.log?snapP(Math.exp(Math.log(g.min)+t*(Math.log(g.max)-Math.log(g.min)))):Math.round((g.min+t*(g.max-g.min))/5)*5};
const pos=(g,v)=>(g.log?(Math.log(v)-Math.log(g.min))/(Math.log(g.max)-Math.log(g.min)):(v-g.min)/(g.max-g.min))*1000;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssu=u=>u.replace(/['"\\()]/g,c=>"%"+c.charCodeAt(0).toString(16));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const best=m=>store.get("best:"+m,0);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const sample=(pool,n,ex)=>shuffle(pool.filter(x=>!ex.includes(x))).slice(0,n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- фото: поиск на Wikimedia Commons по названию, поколению и году ---------- */
const N=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const BAD=/logo|badge|emblem|icon|interior|dashboard|cockpit|engine|wheel|seat|steering|gauge|speedo|diagram|drawing|blueprint|map|chassis|cutaway|schematic|light|detail|console|trunk|boot|crash|wreck|poster|portrait|toy|lego|scale|miniature|screenshot|render|sketch/i;
const API="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1280&gsrsearch=";
async function jget(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}
}
async function getCands(car){
  if(car.cands) return car.cands;
  const ck="c3:"+car.name,c=store.get(ck,null);
  if(c&&Date.now()-c.t<6048e5){car.cands=c.l;car.bad=!c.l.length;return c.l}
  const first=t=>t.split("|")[0];
  const q=car.name+" "+car.k.filter(t=>!N(car.name).includes(N(first(t)))).map(first).join(" ");
  const j=await jget(API+encodeURIComponent(q));
  const pages=j&&j.query&&j.query.pages?Object.values(j.query.pages):[];
  pages.sort((a,b)=>a.index-b.index);
  const l=[];
  for(const p of pages){
    const ii=p.imageinfo&&p.imageinfo[0];
    if(!ii||ii.mime!=="image/jpeg"||ii.width<1000) continue;
    const r=ii.width/ii.height; if(r<1.25||r>2.4) continue;
    const t=p.title.replace(/^File:/,""),f=N(t);
    if(BAD.test(t)||(car.x&&car.x.test(f))) continue;
    if(!car.k.every(k=>k.split("|").some(a=>f.includes(a)))) continue;
    l.push({u:ii.thumburl||ii.url,page:ii.descriptionurl||"https://commons.wikimedia.org/wiki/"+encodeURIComponent(p.title)});
    if(l.length>=12) break;
  }
  car.cands=l;car.bad=!l.length;store.set(ck,{t:Date.now(),l});
  return l;
}
const loadImg=u=>new Promise(r=>{const i=new Image();let d=0;const f=v=>{if(!d){d=1;r(v)}};i.decoding="async";i.onload=()=>f({u,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>f(null);setTimeout(()=>f(null),12000);i.src=u});
async function photoFor(s,car){
  let l; try{l=await getCands(car)}catch(e){return null}
  const fresh=l.filter(c=>!s.used.has(c.u));
  for(const c of (fresh.length?shuffle(fresh):shuffle(l)).slice(0,3)){
    for(const u of [c.u,c.u.replace(/\/\d+px-/,"/960px-")]){
      const r=await loadImg(u);
      if(r&&r.w>=640){if(s.used.size>80)s.used.clear();s.used.add(c.u);return {src:r.u,w:r.w,h:r.h,page:c.page}}
    }
  }
  return null;
}

/* ---------- вопросы ---------- */
function pick(s,pool,any){
  const rc=s.recent.slice(-10),ok=pool.filter(c=>any||!c.bad),free=ok.filter(c=>!rc.includes(c));
  const src=free.length?free:ok;return src[rnd(src.length)];
}
async function duel(s,kind){
  const f=kind==="power"?"hp":"p",pool=f==="p"?CARS.filter(c=>c.p):CARS;
  for(let i=0;i<40;i++){
    const a=pick(s,pool,1),b=pick(s,pool,1);
    if(a===b||Math.abs(a[f]-b[f])/Math.max(a[f],b[f])<.06) continue;
    s.recent.push(a,b);
    const ph=await Promise.all([photoFor(s,a),photoFor(s,b)]);
    return {kind,f,items:[a,b],ph,ans:a[f]>b[f]?0:1};
  }
  return null;
}
async function makeQ(s){
  const kind=s.mode==="mix"?MIXK[rnd(MIXK.length)]:s.mode;
  if(kind==="power"||kind==="rich") return duel(s,kind);
  const pool=kind==="gc"?CARS.filter(c=>c.p):CARS;
  for(let i=0;i<8;i++){
    const car=pick(s,pool); if(!car) break;
    const ph=await photoFor(s,car); if(!ph) continue;
    s.recent.push(car);
    if(kind==="gp"||kind==="gc") return {kind,car,ph};
    let labels,ans;
    if(kind==="brand"){labels=shuffle([car.b,...sample(BRANDS,3,[car.b])]);ans=labels.indexOf(car.b)}
    else{const o=shuffle([car,...sample(CARS,3,[car])]);labels=o.map(c=>c.name);ans=o.indexOf(car)}
    return {kind,car,ph,labels,ans};
  }
  return null;
}

/* ---------- экраны ---------- */
const app=$("app");
let S=null,token=0;

function menu(){
  token++;S=null;
  const rows=Object.keys(MODES).map((k,i)=>`
    <button class="mode ${k}" data-mode="${k}" style="--i:${i}">
      <span><strong>${MODES[k].t}</strong><small>${MODES[k].d}</small></span>
      <span class="rec">${best(k)}<small>рекорд</small></span>
    </button>`).join("");
  app.innerHTML=`<div class="hero">
    <svg class="gauge" viewBox="0 0 200 124" role="img" aria-label="Тахометр">
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"/>
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="#ffc400" stroke-width="12" stroke-dasharray="72 100"/>
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="#e5322d" stroke-width="12" stroke-dasharray="0 78 22 100"/>
      <line class="needle" x1="100" y1="110" x2="100" y2="44" stroke="#f5f6fa" stroke-width="5"/>
      <circle cx="100" cy="110" r="9" fill="#ffc400"/></svg>
    <h1 class="word">Тахо</h1><p class="sub">Автовикторина без рекламы · машин: ${CARS.length}</p></div>
  <div class="modes">${rows}</div>
  <p class="note">Фото подгружаются с Wikimedia Commons, нужен интернет. Мощность в л.с. и цена в $ относятся к указанной версии и года выпуска. Цена — новой машины на старте продаж, значения приблизительные.</p>`;
}
function start(mode){
  token++;
  S={mode,score:0,streak:0,lives:3,q:null,pre:null,recent:[],used:new Set(),locked:false,newBest:false};
  next();
}
const barH=()=>`<button class="back" data-act="menu" aria-label="В меню">‹</button>
  <div class="mt">${MODES[S.mode].t}<small>рекорд ${Math.max(best(S.mode),S.score)}</small></div>
  <div class="lives" role="img" aria-label="Жизней: ${S.lives}">${[0,1,2].map(i=>`<i class="${i<S.lives?"":"gone"}"></i>`).join("")}</div>`;
const meterH=()=>{
  const lit=S.streak?((S.streak-1)%10)+1:0;let g="";
  for(let i=0;i<10;i++) g+=`<i class="${i<lit?"on":""}${i>=8?" hot":""}${i===lit-1?" last":""}"></i>`;
  return `<b>${S.score}</b><div class="tach" aria-hidden="true">${g}</div>`;
};
async function go(){
  if(!S) return;
  app.classList.add("leave");await sleep(170);app.classList.remove("leave");next();
}
async function next(){
  const s=S,t=token;
  app.innerHTML=`<div class="shot sk"><div class="bar" id="bar">${barH()}</div><div class="meter" id="meter">${meterH()}</div></div>`;
  let q=s.pre?await s.pre:null;s.pre=null;
  if(!q) q=await makeQ(s);
  if(t!==token) return;
  if(!q){
    app.innerHTML=`<div class="bar flow" id="bar">${barH()}</div><div class="err">Не получилось загрузить фото. Проверь интернет и попробуй ещё раз.</div><div class="nextbar"><button class="next" data-act="retry">Повторить</button></div>`;
    return;
  }
  s.q=q;s.locked=false;renderQ();
  s.pre=makeQ(s);
}
const shotHTML=p=>{
  const contain=p.w/p.h<1.35;
  return `<div class="shot" id="shot">${contain?`<div class="bgb" style="background-image:url('${cssu(p.src)}')"></div>`:""}
  <img class="${contain?"contain":""}" src="${esc(p.src)}" alt="Автомобиль, название скрыто"><i class="fx"></i><div id="cap"></div>
  <div class="bar" id="bar">${barH()}</div><div class="meter" id="meter">${meterH()}</div></div>`;
};
function renderQ(){
  const s=S,q=s.q;
  if(q.kind==="power"||q.kind==="rich"){
    const pr=q.f==="p";
    app.innerHTML=`<div class="bar flow" id="bar">${barH()}</div><div class="meter flow" id="meter">${meterH()}</div>
    <p class="q">${pr?"Какой автомобиль дороже?":"Какой автомобиль мощнее?"}${pr?"<small>Цена новой машины на старте продаж</small>":""}</p>
    <div class="duel">${q.items.map((c,i)=>`<button class="dcard" data-i="${i}" style="--i:${i}">
      ${q.ph[i]?`<img src="${esc(q.ph[i].src)}" alt="${esc(c.name)}">`:""}<i class="edge"></i>
      <span class="info"><span><span class="nm">${esc(c.name)}</span><span class="vr">${esc(c.v)}</span></span><span class="hp">${pr?"$ ":""}<b>?</b>${pr?"":"<small>л.с.</small>"}</span></span>
      <i class="fill"></i></button>`).join("")}</div><div id="after"></div>`;
    return;
  }
  if(q.kind==="gp"||q.kind==="gc"){
    const g=G[q.kind],t0=q.kind==="gp"?450:500;
    app.innerHTML=shotHTML(q.ph)+`<p class="q">${g.ask}<small>${esc(q.car.name)} · ${esc(q.car.v)}</small></p>
    <div class="guess"><div class="read" id="read">${g.fmt(val(g,t0))}</div>
    <div class="rw" id="rw"><input class="rng" id="rng" type="range" min="0" max="1000" step="1" value="${t0}" style="--p:${t0/10}%" aria-label="Твоя оценка"></div>
    <div class="lh"><span>${g.fmt(g.min)}</span><span>${g.fmt(g.max)}</span></div></div>
    <div id="after"><div class="nextbar"><button class="next" data-act="check">Проверить</button></div></div>`;
    return;
  }
  app.innerHTML=shotHTML(q.ph)+`<p class="q">${q.kind==="brand"?"Какая это марка?":"Что это за модель?"}</p>
  <div class="opts">${q.labels.map((l,i)=>`<button class="opt" data-i="${i}" style="--i:${i}">${esc(l)}</button>`).join("")}</div><div id="after"></div>`;
}
function countUp(el,to,fmt){
  fmt=fmt||(v=>v);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=fmt(to);return}
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0);
}
function settle(ok){
  const s=S;
  if(ok){s.score++;s.streak++;if(s.score>best(s.mode)){store.set("best:"+s.mode,s.score);s.newBest=true}}
  else{s.lives--;s.streak=0}
  $("bar").innerHTML=barH();$("meter").innerHTML=meterH();
  if(ok) document.querySelector("#meter b").classList.add("pop");
  return ok&&s.streak%5===0?"серия ×"+s.streak:"";
}
function reveal(ok,q,st,extra){
  $("shot").classList.add(ok?"gl":"rd");
  const credit=q.ph.page?`<a href="${esc(q.ph.page)}" target="_blank" rel="noopener">Фото: Wikimedia Commons</a>`:"";
  $("cap").innerHTML=`${ok?"Верно!":"Не то."} ${esc(q.car.name)}<small>${[extra,st,credit].filter(Boolean).join(" · ")}</small>`;
}
function finish(fb){
  $("after").innerHTML=fb+`<div class="nextbar"><button class="next" data-act="${S.lives>0?"next":"over"}">${S.lives>0?"Дальше":"Финиш"}</button></div>`;
}
function answer(i){
  const s=S;if(!s||s.locked||!s.q) return;
  s.locked=true;
  const q=s.q,ok=i===q.ans;
  document.querySelectorAll("[data-i]").forEach(b=>{
    const k=+b.dataset.i;b.classList.add(k===q.ans?"ok":(k===i?"bad":"dim"));b.setAttribute("aria-disabled","true");
  });
  const st=settle(ok);
  if(q.items){
    const mx=Math.max(q.items[0][q.f],q.items[1][q.f]);
    document.querySelectorAll(".dcard").forEach((b,k)=>{
      countUp(b.querySelector(".hp b"),q.items[k][q.f],q.f==="p"?grp:null);
      requestAnimationFrame(()=>{b.querySelector(".fill").style.width=(q.items[k][q.f]/mx*100)+"%"});
    });
    finish(`<p class="fb">${ok?"Верно":"Не угадал"}${st?" · "+st:""}</p>`);
  }else{
    reveal(ok,q,st,"");
    finish("");
  }
}
function check(){
  const s=S;if(!s||s.locked||!s.q) return;
  s.locked=true;
  const q=s.q,g=G[q.kind],rng=$("rng"),guess=val(g,+rng.value),real=q.car[g.f];
  const ok=Math.abs(guess-real)/real<=g.tol;
  rng.disabled=true;
  const rd=$("read");rd.classList.add(ok?"ok":"bad");
  const st=settle(ok);
  $("rw").insertAdjacentHTML("afterbegin",`<i class="mark" style="--m:${Math.min(1,Math.max(0,pos(g,real)/1000))}"><span>${g.fmt(real)}</span></i>`);
  const d=Math.round((guess-real)/real*100);
  reveal(ok,q,st,"");
  finish(`<p class="fb">${ok?"Верно!":"Мимо."} Правильный ответ: <b>${g.fmt(real)}</b>${d===0?"":` (ты ${d>0?"завысил":"занизил"} на ${Math.abs(d)}%)`}. Засчитываю в пределах ±${Math.round(g.tol*100)}%.</p>`);
}
function over(){
  const s=S;token++;
  const cf=s.newBest&&s.score>0?`<div class="cf">${Array.from({length:28},(_,i)=>`<i style="left:${15+rnd(70)}%;--x:${rnd(260)-130}px;--y:${-(90+rnd(240))}px;--r:${rnd(540)}deg;--d:${rnd(350)}ms;background:${["#ffc400","#f5f6fa","#e5322d","#22a559"][i%4]}"></i>`).join("")}</div>`:"";
  app.innerHTML=`<div class="over">${cf}<h2>Гонка окончена</h2><div class="big" id="big">0</div>
    <p>${s.newBest&&s.score>0?"Новый рекорд!":"Рекорд: "+best(s.mode)}</p>
    <div class="nextbar" style="position:static"><button class="next" data-act="again">Ещё раз</button></div>
    <button class="ghost" data-act="menu">В меню</button></div>`;
  countUp($("big"),s.score);
}
app.addEventListener("input",e=>{
  if(e.target.id!=="rng"||!S||!S.q) return;
  const g=G[S.q.kind],t=+e.target.value;
  e.target.style.setProperty("--p",t/10+"%");
  $("read").textContent=g.fmt(val(g,t));
});
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-mode],[data-i]");
  if(!el) return;
  if(el.dataset.act){
    const a=el.dataset.act;
    if(a==="menu") menu();else if(a==="next") go();else if(a==="retry") next();else if(a==="check") check();else if(a==="over") over();else if(a==="again") start(S.mode);
  }else if(el.dataset.mode) start(el.dataset.mode);
  else if(el.dataset.i!==undefined) answer(+el.dataset.i);
});
menu();
</script>
</body>
</html>
