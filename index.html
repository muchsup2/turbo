<title>Тахо — автовикторина</title>
<style>
:root{--blue:#1b2a6b;--deep:#0f1745;--yellow:#ffc400;--paper:#f5f6fa;--green:#22a559;--red:#e5322d;
--display:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",sans-serif;
--text:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;--snap:cubic-bezier(.2,.9,.25,1.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--deep)}
body{margin:0;min-height:100dvh;color:var(--paper);font-family:var(--text);touch-action:manipulation;
background:radial-gradient(120% 55% at 50% 0,#2e45b9 0,rgba(46,69,185,0) 70%),repeating-linear-gradient(-20deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),linear-gradient(#17236a,#0b1038)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
.app.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pulse{40%{transform:scale(1.035)}}

/* меню */
.hero{text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.gauge{width:240px;max-width:68%;display:block;margin:0 auto}
.needle{transform-origin:100px 110px;transform:rotate(40deg);animation:rev 1.3s var(--snap) both}
@keyframes rev{from{transform:rotate(-92deg)}55%{transform:rotate(60deg)}to{transform:rotate(40deg)}}
.word{font:italic 800 92px/.95 var(--display);color:var(--yellow);margin:0;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:up .6s .15s both}
.sub{margin:8px 0 0;font-size:15px;opacity:.8;animation:up .6s .25s both}
.modes{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);color:var(--deep);padding:15px 18px;border-left:8px solid var(--yellow);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);animation:up .55s var(--snap) both;animation-delay:calc(.3s + var(--i)*.08s);transition:transform .15s}
.mode:active{transform:scale(.97)}
.mode.mix{background:var(--yellow);border-left-color:var(--deep);padding:20px 18px}
.mode strong{display:block;font:italic 800 28px/1.05 var(--display)}
.mode.mix strong{font-size:34px}
.mode small{display:block;font-size:14px;opacity:.7;margin-top:3px}
.rec{font:italic 800 22px var(--display);text-align:right}
.rec small{font:500 12px var(--text);margin:0}
.note{font-size:12.5px;line-height:1.45;opacity:.6;margin:8px 4px 0;animation:up .6s .7s both}

/* игра: шапка и счёт */
.bar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.meter{position:absolute;left:16px;right:64px;bottom:36px;z-index:2;display:flex;align-items:flex-end;gap:14px}
.flow{position:static;margin:0 -16px;padding-left:16px;padding-right:16px}
.meter.flow{padding:0;margin:0}
.back{width:40px;height:40px;font-size:30px;line-height:1;display:grid;place-items:center;padding-bottom:3px;background:rgba(10,15,50,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mt{flex:1;font:italic 800 22px/1 var(--display);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mt small{display:block;font:500 12px var(--text);opacity:.8;margin-top:3px}
.lives{display:flex;gap:6px}
.lives i{width:16px;height:16px;background:var(--yellow);transform:skewX(-20deg);transition:transform .35s,background .35s}
.lives i.gone{background:rgba(255,255,255,.25);transform:skewX(-20deg) scale(.6)}
.meter b{font:italic 800 66px/.85 var(--display);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.meter b.pop{animation:pop .45s var(--snap)}
@keyframes pop{40%{transform:scale(1.35);color:var(--yellow)}}
.tach{flex:1;display:flex;gap:4px;padding-bottom:4px}
.tach i{flex:1;height:10px;background:rgba(255,255,255,.22);transform:skewX(-20deg);transition:background .3s}
.tach i.on{background:var(--yellow)}.tach i.on.hot{background:var(--red)}
.tach i.last{animation:pulse .5s}

/* фото */
.shot{position:relative;margin:0 -16px;height:calc(env(safe-area-inset-top,0px) + min(68vw,350px));background:var(--deep);overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 46px) 100%,0 100%)}
.shot.sk{background:linear-gradient(100deg,#0f1745 30%,#2a3ea8 50%,#0f1745 70%) 0 0/250% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;animation:reveal .8s cubic-bezier(.2,.8,.2,1) both}
.shot img.contain{object-fit:contain}
.bgb{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) brightness(.65)}
.shot::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(8,12,40,.6),transparent 30%,transparent 50%,rgba(8,12,40,.9))}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:scale(1.14)}to{clip-path:inset(0);transform:scale(1)}}
.fx{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none}
.shot.gl .fx{background:var(--green);animation:flash .7s}
.shot.rd .fx{background:var(--red);animation:flash .7s}
@keyframes flash{from{opacity:.7}to{opacity:0}}
.cap{position:absolute;left:16px;right:16px;bottom:92px;z-index:2;font:italic 800 30px/1.05 var(--display);text-shadow:0 2px 12px rgba(0,0,0,.7);animation:up .45s var(--snap) both}
.cap small{display:block;font:500 13px var(--text);margin-top:4px;opacity:.85}
.cap a{color:inherit}
.q{font:italic 800 28px/1.1 var(--display);margin:2px 0 0;animation:up .5s .1s both}

/* ответы */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--paper);color:var(--deep);text-align:left;padding:14px 16px;font-size:17px;font-weight:600;border-left:6px solid var(--yellow);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);animation:up .45s var(--snap) both;animation-delay:calc(.15s + var(--i)*.07s);transition:transform .12s,opacity .3s,background .25s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--green);color:#fff;border-left-color:#fff;animation:pulse .5s}
.opt.bad{background:var(--red);color:#fff;border-left-color:#fff;animation:shake .4s}
.opt.dim{opacity:.45}

/* дуэль */
.duel{display:flex;flex-direction:column;gap:10px}
.dcard{position:relative;display:block;width:100%;height:clamp(150px,26dvh,230px);overflow:hidden;background:var(--deep);text-align:left;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);animation:up .55s var(--snap) both;animation-delay:calc(.12s + var(--i)*.1s);transition:transform .12s,opacity .3s}
.dcard:active{transform:scale(.985)}
.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;animation:reveal .8s cubic-bezier(.2,.8,.2,1) both}
.dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,12,40,.1) 25%,rgba(8,12,40,.92))}
.dcard .edge{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--yellow);z-index:2;transition:background .3s}
.dcard.ok .edge{background:var(--green)}.dcard.bad .edge{background:var(--red)}.dcard.dim{opacity:.55}
.dcard .info{position:absolute;left:20px;right:16px;bottom:14px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dcard .nm{font:italic 800 27px/1.02 var(--display);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dcard .vr{display:block;font:500 13px var(--text);opacity:.8;margin-top:3px}
.dcard .hp{font:italic 800 38px/1 var(--display);white-space:nowrap}
.dcard .hp small{font:600 13px var(--text);opacity:.8;margin-left:3px}
.dcard .fill{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--yellow);z-index:3;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dcard.ok .fill{background:var(--green)}.dcard.bad .fill{background:var(--red)}

.fb{margin:0;font-size:17px;animation:up .4s both}
.nextbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:auto;padding-top:6px;animation:up .4s var(--snap) both}
.next{width:100%;background:var(--yellow);color:var(--deep);font:italic 800 25px var(--display);padding:15px;text-align:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.next:active{transform:scale(.98)}
.err{background:var(--deep);padding:18px;font-size:16px;line-height:1.45;margin-top:16px}

/* финиш */
.over{position:relative;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 40px);display:flex;flex-direction:column;gap:12px}
.over h2{font:italic 800 46px/1 var(--display);margin:0;color:var(--yellow);animation:up .5s both}
.over .big{font:italic 800 132px/1 var(--display);animation:up .6s .1s both}
.over p{margin:0;font-size:18px;opacity:.9;animation:up .5s .2s both}
.ghost{background:rgba(255,255,255,.12);text-align:center;padding:14px;font-size:17px;font-weight:600}
.cf{position:absolute;left:0;right:0;top:150px;height:0;pointer-events:none}
.cf i{position:absolute;width:8px;height:18px;animation:burst 1.2s ease-out var(--d) both}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<script>
"use strict";
/* b — марка, m — модель, w — статья Wikipedia для фото, pw — запасная статья только для дуэли, hp — л.с. версии v */
const CARS=[
 {b:"Ferrari",m:"F40",w:"Ferrari F40",hp:478,v:"1987"},
 {b:"Ferrari",m:"Enzo",w:"Ferrari Enzo",hp:660,v:"2002"},
 {b:"Ferrari",m:"458 Italia",w:"Ferrari 458 Italia",hp:570,v:"2009"},
 {b:"Ferrari",m:"LaFerrari",w:"LaFerrari",hp:963,v:"2013"},
 {b:"Lamborghini",m:"Countach",w:"Lamborghini Countach",hp:455,v:"5000 QV, 1985"},
 {b:"Lamborghini",m:"Murciélago",w:"Lamborghini Murciélago",hp:580,v:"2001"},
 {b:"Lamborghini",m:"Aventador",w:"Lamborghini Aventador",hp:700,v:"2011"},
 {b:"Lamborghini",m:"Huracán",w:"Lamborghini Huracán",hp:610,v:"2014"},
 {b:"Porsche",m:"911",w:"Porsche 911",hp:420,v:"Carrera S, 2016"},
 {b:"Porsche",m:"918 Spyder",w:"Porsche 918 Spyder",hp:887,v:"2013"},
 {b:"Nissan",m:"GT-R",w:"Nissan GT-R",hp:570,v:"R35, 2017"},
 {b:"Nissan",m:"Skyline GT-R",w:"Nissan Skyline GT-R",hp:280,v:"R34, 1999"},
 {b:"Toyota",m:"Supra",w:"Toyota Supra",hp:340,v:"GR Supra, 2019"},
 {b:"Mazda",m:"RX-7",w:"Mazda RX-7",hp:255,v:"FD, 1992"},
 {b:"Honda",m:"NSX",w:"Honda NSX",hp:280,v:"1990"},
 {b:"Audi",m:"R8",w:"Audi R8",hp:420,v:"V8, 2007"},
 {b:"McLaren",m:"F1",w:"McLaren F1",hp:627,v:"1993"},
 {b:"McLaren",m:"P1",w:"McLaren P1",hp:916,v:"2013"},
 {b:"Bugatti",m:"Veyron",w:"Bugatti Veyron",hp:1001,v:"16.4, 2005"},
 {b:"Pagani",m:"Zonda",w:"Pagani Zonda",hp:602,v:"F, 2005"},
 {b:"Koenigsegg",m:"Agera",w:"Koenigsegg Agera",hp:1115,v:"R, 2011"},
 {b:"Ford",m:"Mustang",w:"Ford Mustang",hp:466,v:"GT, 2018"},
 {b:"Ford",m:"GT",w:"Ford GT",hp:656,v:"2017"},
 {b:"Chevrolet",m:"Camaro",w:"Chevrolet Camaro",hp:659,v:"ZL1, 2017"},
 {b:"Chevrolet",m:"Corvette",w:"Chevrolet Corvette",hp:502,v:"C8 Stingray, 2020"},
 {b:"Dodge",m:"Challenger",w:"Dodge Challenger",hp:717,v:"SRT Hellcat, 2015"},
 {b:"Dodge",m:"Viper",w:"Dodge Viper",hp:649,v:"SRT, 2013"},
 {b:"Aston Martin",m:"DB5",w:"Aston Martin DB5",hp:286,v:"1963"},
 {b:"Jaguar",m:"E-Type",w:"Jaguar E-Type",hp:269,v:"1961"},
 {b:"Mercedes-Benz",m:"300 SL",w:"Mercedes-Benz 300 SL",hp:215,v:"1954"},
 {b:"BMW",m:"M3",w:"BMW M3",hp:343,v:"E46, 2000"},
 {b:"BMW",m:"M5",w:"BMW M5",hp:600,v:"F90, 2018"},
 {b:"Mercedes-AMG",m:"E 63 S",w:null,pw:"Mercedes-Benz E-Class (W213)",hp:612,v:"W213, 2017"},
 {b:"Subaru",m:"Impreza WRX STI",w:"Subaru Impreza WRX STI",hp:304,v:"2018"},
 {b:"Mitsubishi",m:"Lancer Evolution",w:"Mitsubishi Lancer Evolution",hp:300,v:"X, 2008"},
 {b:"Lexus",m:"LFA",w:"Lexus LFA",hp:560,v:"2010"},
 {b:"Tesla",m:"Model S",w:"Tesla Model S",hp:1034,v:"Plaid, 2021"}
];
const PHOTO=CARS.filter(c=>c.w), BRANDS=[...new Set(PHOTO.map(c=>c.b))];
const MODES={mix:{t:"Микс",d:"Все режимы вперемешку"},model:{t:"Угадай модель",d:"Фото и 4 варианта"},brand:{t:"Угадай марку",d:"Только марка, зато быстро"},power:{t:"Что мощнее",d:"Два авто, выбери мощнее"}};
const nm=c=>c.b+" "+c.m;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssu=u=>u.replace(/['"\\()]/g,c=>"%"+c.charCodeAt(0).toString(16));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const best=m=>store.get("best:"+m,0);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const sample=(pool,n,ex)=>shuffle(pool.filter(x=>!ex.includes(x))).slice(0,n);

/* ---------- фото: заглавное + подходящие из статьи Wikipedia ---------- */
const N=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const BAD=/logo|badge|emblem|icon|interior|dashboard|cockpit|engine|wheel|seat|steering|gauge|speedo|diagram|drawing|blueprint|map|chassis|cutaway|schematic|light|detail|console|trunk|boot|crash|wreck|poster/i;
const key=u=>u.replace(/\/\d+px-[^/]*$/,"");
const sizes=u=>[...new Set([1280,960,500].map(w=>u.replace(/\/\d+px-/,"/"+w+"px-")))];
async function jget(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch(u,{signal:c.signal});if(r.status===404)return null;if(!r.ok)throw 0;return await r.json()}
  finally{clearTimeout(t)}
}
async function getImgs(car){
  if(car.imgs) return car.imgs;
  const k=encodeURIComponent((car.w||car.pw).replace(/ /g,"_")),base="https://en.wikipedia.org/api/rest_v1/page/";
  const [sum,ml]=await Promise.all([jget(base+"summary/"+k),jget(base+"media-list/"+k).catch(()=>null)]);
  const imgs=[],seen=new Set();
  const add=u=>{if(u&&!seen.has(key(u))&&imgs.length<8){seen.add(key(u));imgs.push(u)}};
  add(sum&&sum.thumbnail&&sum.thumbnail.source);
  car.page=(sum&&sum.content_urls&&sum.content_urls.desktop&&sum.content_urls.desktop.page)||"";
  if(ml&&ml.items&&car.w){
    const mn=N(car.m),bn=N(car.b);
    for(const it of ml.items){
      const raw=it.title||"";
      if(it.type!=="image"||!it.srcset||!it.srcset.length||!/\.jpe?g$/i.test(raw)||BAD.test(raw)) continue;
      const f=N(raw);
      if(!f.includes(mn)||(mn.length<4&&!f.includes(bn))) continue;
      let s=it.srcset[it.srcset.length-1].src; if(s.startsWith("//")) s="https:"+s;
      add(s);
    }
  }
  car.bad=!imgs.length; car.imgs=imgs; return imgs;
}
const loadImg=u=>new Promise(r=>{const i=new Image();let d=0;const f=v=>{if(!d){d=1;r(v)}};i.onload=()=>f({u,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>f(null);setTimeout(()=>f(null),12000);i.src=u});
async function photoFor(s,car){
  let imgs; try{imgs=await getImgs(car)}catch(e){return null}
  const fresh=imgs.filter(u=>!s.used.has(key(u)));
  for(const u of (fresh.length?shuffle(fresh):shuffle(imgs)).slice(0,3)){
    for(const z of sizes(u)){
      const r=await loadImg(z);
      if(r){ if(r.w<640) break; if(s.used.size>60) s.used.clear(); s.used.add(key(u)); return {src:r.u,w:r.w,h:r.h,page:car.page}; }
    }
  }
  return null;
}

/* ---------- вопросы ---------- */
function pick(s,pool,anyCar){
  const rc=s.recent.slice(-8),ok=pool.filter(c=>anyCar||!c.bad),free=ok.filter(c=>!rc.includes(c));
  const src=free.length?free:ok; return src[rnd(src.length)];
}
async function makeQ(s){
  const kind=s.mode==="mix"?["model","model","brand","power","power"][rnd(5)]:s.mode;
  if(kind==="power"){
    for(let i=0;i<30;i++){
      const a=pick(s,CARS,1),b=pick(s,CARS,1);
      if(a===b||Math.abs(a.hp-b.hp)/Math.max(a.hp,b.hp)<.06) continue;
      s.recent.push(a,b);
      const ph=await Promise.all([photoFor(s,a),photoFor(s,b)]);
      return {kind,items:[a,b],ph,ans:a.hp>b.hp?0:1};
    }
    return null;
  }
  for(let i=0;i<7;i++){
    const car=pick(s,PHOTO); if(!car) break;
    const ph=await photoFor(s,car); if(!ph) continue;
    s.recent.push(car);
    let labels,ans;
    if(kind==="brand"){labels=shuffle([car.b,...sample(BRANDS,3,[car.b])]);ans=labels.indexOf(car.b)}
    else{const o=shuffle([car,...sample(PHOTO,3,[car])]);labels=o.map(nm);ans=o.indexOf(car)}
    return {kind,car,ph,labels,ans};
  }
  return null;
}

/* ---------- экраны ---------- */
const app=document.getElementById("app");
let S=null,token=0;

function menu(){
  token++;S=null;
  const rows=["mix","model","brand","power"].map((k,i)=>`
    <button class="mode ${k}" data-mode="${k}" style="--i:${i}">
      <span><strong>${MODES[k].t}</strong><small>${MODES[k].d}</small></span>
      <span class="rec">${best(k)}<small>рекорд</small></span>
    </button>`).join("");
  app.innerHTML=`<div class="hero">
    <svg class="gauge" viewBox="0 0 200 124" role="img" aria-label="Тахометр">
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"/>
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="#ffc400" stroke-width="12" stroke-dasharray="72 100"/>
      <path d="M20 110 A80 80 0 0 1 180 110" pathLength="100" fill="none" stroke="#e5322d" stroke-width="12" stroke-dasharray="0 78 22 100"/>
      <line class="needle" x1="100" y1="110" x2="100" y2="44" stroke="#f5f6fa" stroke-width="5"/>
      <circle cx="100" cy="110" r="9" fill="#ffc400"/></svg>
    <h1 class="word">Тахо</h1><p class="sub">Автовикторина без рекламы · машин: ${CARS.length}</p></div>
  <div class="modes">${rows}</div>
  <p class="note">Фото подгружаются из Wikipedia, нужен интернет. Мощность указана в л.с. для конкретной версии, значения округлены.</p>`;
}
function start(mode){
  token++;
  S={mode,score:0,streak:0,lives:3,q:null,pre:null,recent:[],used:new Set(),locked:false,newBest:false};
  next();
}
const barH=()=>`<button class="back" data-act="menu" aria-label="В меню">‹</button>
  <div class="mt">${MODES[S.mode].t}<small>рекорд ${Math.max(best(S.mode),S.score)}</small></div>
  <div class="lives" role="img" aria-label="Жизней: ${S.lives}">${[0,1,2].map(i=>`<i class="${i<S.lives?"":"gone"}"></i>`).join("")}</div>`;
const meterH=()=>{
  const lit=S.streak?((S.streak-1)%10)+1:0;let g="";
  for(let i=0;i<10;i++) g+=`<i class="${i<lit?"on":""}${i>=8?" hot":""}${i===lit-1?" last":""}"></i>`;
  return `<b>${S.score}</b><div class="tach" aria-hidden="true">${g}</div>`;
};
async function next(){
  const s=S,t=token;
  app.innerHTML=`<div class="shot sk"><div class="bar" id="bar">${barH()}</div><div class="meter" id="meter">${meterH()}</div></div>`;
  let q=s.pre?await s.pre:null;s.pre=null;
  if(!q) q=await makeQ(s);
  if(t!==token) return;
  if(!q){
    app.innerHTML=`<div class="bar flow" id="bar">${barH()}</div><div class="err">Не получилось загрузить фото. Проверь интернет и попробуй ещё раз.</div><div class="nextbar"><button class="next" data-act="retry">Повторить</button></div>`;
    return;
  }
  s.q=q;s.locked=false;renderQ();
  s.pre=makeQ(s);
}
function renderQ(){
  const s=S,q=s.q;
  if(q.kind==="power"){
    app.innerHTML=`<div class="bar flow" id="bar">${barH()}</div><div class="meter flow" id="meter">${meterH()}</div>
    <p class="q">Какой автомобиль мощнее?</p>
    <div class="duel">${q.items.map((c,i)=>`<button class="dcard" data-i="${i}" style="--i:${i}">
      ${q.ph[i]?`<img src="${esc(q.ph[i].src)}" alt="${esc(nm(c))}">`:""}<i class="edge"></i>
      <span class="info"><span><span class="nm">${esc(nm(c))}</span><span class="vr">${esc(c.v)}</span></span><span class="hp"><b>?</b><small>л.с.</small></span></span>
      <i class="fill"></i></button>`).join("")}</div><div id="after"></div>`;
    return;
  }
  const p=q.ph,contain=p.w/p.h<1.35;
  app.innerHTML=`<div class="shot" id="shot">${contain?`<div class="bgb" style="background-image:url('${cssu(p.src)}')"></div>`:""}
    <img class="${contain?"contain":""}" src="${esc(p.src)}" alt="Автомобиль, название скрыто"><i class="fx"></i><div id="cap"></div>
    <div class="bar" id="bar">${barH()}</div><div class="meter" id="meter">${meterH()}</div></div>
  <p class="q">${q.kind==="brand"?"Какая это марка?":"Что это за модель?"}</p>
  <div class="opts">${q.labels.map((l,i)=>`<button class="opt" data-i="${i}" style="--i:${i}">${esc(l)}</button>`).join("")}</div><div id="after"></div>`;
}
function countUp(el,to){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=to;return}
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
}
function answer(i){
  const s=S;if(!s||s.locked||!s.q) return;
  s.locked=true;
  const q=s.q,ok=i===q.ans;
  if(ok){s.score++;s.streak++;if(s.score>best(s.mode)){store.set("best:"+s.mode,s.score);s.newBest=true}}
  else{s.lives--;s.streak=0;app.classList.add("shake");setTimeout(()=>app.classList.remove("shake"),450)}
  document.querySelectorAll("[data-i]").forEach(b=>{
    const k=+b.dataset.i;b.classList.add(k===q.ans?"ok":(k===i?"bad":"dim"));b.setAttribute("aria-disabled","true");
  });
  document.getElementById("bar").innerHTML=barH();
  document.getElementById("meter").innerHTML=meterH();
  if(ok) document.querySelector("#meter b").classList.add("pop");
  const streak=ok&&s.streak%5===0?`серия ×${s.streak}`:"";
  let fb="";
  if(q.kind==="power"){
    const mx=Math.max(q.items[0].hp,q.items[1].hp);
    document.querySelectorAll(".dcard").forEach((b,k)=>{
      countUp(b.querySelector(".hp b"),q.items[k].hp);
      requestAnimationFrame(()=>{b.querySelector(".fill").style.width=(q.items[k].hp/mx*100)+"%"});
    });
    fb=`<p class="fb">${ok?"Верно":"Не угадал"}${streak?" · "+streak:""}</p>`;
  }else{
    document.getElementById("shot").classList.add(ok?"gl":"rd");
    document.getElementById("cap").innerHTML=`${ok?"Верно!":"Не то."} ${esc(nm(q.car))}<small>${streak?streak+" · ":""}${q.ph.page?`<a href="${esc(q.ph.page)}" target="_blank" rel="noopener">Фото: Wikipedia</a>`:"Фото: Wikipedia"}</small>`;
  }
  document.getElementById("after").innerHTML=fb+`<div class="nextbar"><button class="next" data-act="${s.lives>0?"next":"over"}">${s.lives>0?"Дальше":"Финиш"}</button></div>`;
  document.querySelector(".nextbar").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function over(){
  const s=S;token++;
  const cf=s.newBest&&s.score>0?`<div class="cf">${Array.from({length:28},(_,i)=>`<i style="left:${15+rnd(70)}%;--x:${rnd(260)-130}px;--y:${-(90+rnd(240))}px;--r:${rnd(540)}deg;--d:${rnd(350)}ms;background:${["#ffc400","#f5f6fa","#e5322d","#22a559"][i%4]}"></i>`).join("")}</div>`:"";
  app.innerHTML=`<div class="over">${cf}<h2>Гонка окончена</h2><div class="big" id="big">0</div>
    <p>${s.newBest&&s.score>0?"Новый рекорд!":"Рекорд: "+best(s.mode)}</p>
    <div class="nextbar" style="position:static"><button class="next" data-act="again">Ещё раз</button></div>
    <button class="ghost" data-act="menu">В меню</button></div>`;
  countUp(document.getElementById("big"),s.score);
}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-mode],[data-i]");
  if(!el) return;
  if(el.dataset.act){
    const a=el.dataset.act;
    if(a==="menu") menu();else if(a==="next"||a==="retry") next();else if(a==="over") over();else if(a==="again") start(S.mode);
  }else if(el.dataset.mode) start(el.dataset.mode);
  else if(el.dataset.i!==undefined) answer(+el.dataset.i);
});
menu();
</script>
</body>
