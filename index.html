<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тахо">
<meta name="theme-color" content="#090d24">
<title>Тахо — Автовикторина и Экзамен ПДД (А и В)</title>
<style>
:root{
  --deep:#070a1e;
  --card-bg:#10163a;
  --yellow:#ffb700;
  --yellow-glow:rgba(255,183,0,0.45);
  --cyan:#00e5ff;
  --cyan-glow:rgba(0,229,255,0.4);
  --paper:#f8f9fe;
  --green:#10b981;
  --green-glow:rgba(16,185,129,0.5);
  --red:#f43f5e;
  --red-glow:rgba(244,63,94,0.5);
  --display:"Avenir Next Condensed","Impact","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --snap:cubic-bezier(0.18, 0.9, 0.22, 1.15);
  --smooth:cubic-bezier(0.4, 0, 0.2, 1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{background:var(--deep);color-scheme:dark}
body{
  margin:0;
  min-height:100dvh;
  color:var(--paper);
  font-family:var(--text);
  touch-action:manipulation;
  background:radial-gradient(130% 65% at 50% -10%, #1e2a70 0%, rgba(30,42,112,0) 75%),
             repeating-linear-gradient(-25deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 24px),
             linear-gradient(180deg, #0d1233 0%, #050716 100%);
  overflow-x:hidden;
  position:relative;
}

#bg-canvas, #fx-canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
#fx-canvas{z-index:999}

button{
  font:inherit;
  color:inherit;
  border:0;
  background:none;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transition:transform 0.15s var(--smooth), filter 0.2s;
}
:focus-visible{outline:3px solid var(--yellow);outline-offset:-2px}

.app{
  position:relative;
  z-index:10;
  max-width:540px;
  margin:0 auto;
  min-height:100dvh;
  padding:0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.app.leave{animation:appLeave 0.18s ease-in forwards}
@keyframes appLeave{to{opacity:0;transform:scale(0.97) translateY(8px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes screenShake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-7px, 3px) rotate(-1deg)}
  40%{transform:translate(6px, -4px) rotate(1deg)}
  60%{transform:translate(-5px, 2px)}
  80%{transform:translate(4px, -1px)}
}
.shake{animation:screenShake 0.4s var(--smooth)}

/* Верхняя панель профиля и опыта */
.user-panel{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) 2px 4px;
}
.rank-badge{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  padding:6px 12px;
  border-radius:20px;
  backdrop-filter:blur(8px);
  cursor:pointer;
}
.rank-icon{font-size:16px}
.rank-txt{font:italic 800 13px/1.1 var(--display);letter-spacing:0.5px}
.rank-txt small{display:block;font:600 10.5px var(--text);color:var(--yellow);text-transform:uppercase}

.user-actions{display:flex;align-items:center;gap:6px}
.btn-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  font-size:17px;
  backdrop-filter:blur(8px);
}
.btn-icon:active{transform:scale(0.9)}

/* Хедер главного меню */
.hero{text-align:center;padding:8px 0 4px;position:relative}
.gauge-box{
  width:230px;
  margin:0 auto;
  position:relative;
  cursor:pointer;
}
.gauge-box svg{width:100%;display:block;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.5))}
.gauge-tap-tip{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
  color:var(--yellow);
  opacity:0.85;
  pointer-events:none;
}
.word{
  font:italic 900 82px/0.9 var(--display);
  letter-spacing:-1px;
  color:var(--yellow);
  margin:4px 0 0;
  text-shadow:0 6px 24px rgba(255,183,0,0.4), 0 3px 0 rgba(0,0,0,0.5);
  animation:up 0.5s 0.08s both;
}
.sub{
  margin:6px 0 0;
  font-size:14.5px;
  font-weight:500;
  color:rgba(255,255,255,0.85);
  animation:up 0.5s 0.15s both;
}

/* Фильтры и тематические паки авто */
.pack-strip{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px 0 8px;
  scrollbar-width:none;
}
.pack-strip::-webkit-scrollbar{display:none}
.pack-chip{
  flex-shrink:0;
  padding:8px 14px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  font-size:13px;
  font-weight:700;
  color:rgba(255,255,255,0.8);
  white-space:nowrap;
  transition:all 0.2s;
}
.pack-chip.active{
  background:linear-gradient(135deg, var(--yellow), #ff9100);
  color:var(--deep);
  border-color:transparent;
  box-shadow:0 0 14px var(--yellow-glow);
}

/* Кнопка ежедневного заезда */
.daily-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:linear-gradient(135deg, #1b2866, #0e153d);
  border:1.5px solid rgba(0,229,255,0.4);
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,229,255,0.15);
  cursor:pointer;
  animation:up 0.4s both;
}
.daily-card:active{transform:scale(0.985)}
.daily-card .d-tit{
  font:italic 900 21px/1.1 var(--display);
  color:var(--cyan);
  display:flex;
  align-items:center;
  gap:8px;
}
.daily-card .d-sub{
  font-size:12.5px;
  color:rgba(255,255,255,0.75);
  margin-top:2px;
}
.daily-pill{
  background:var(--cyan);
  color:var(--deep);
  font:italic 900 13px/1 var(--display);
  padding:6px 12px;
  border-radius:14px;
}

/* Список режимов игры */
.modes{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:2px;
}
.mode{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  background:linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #e3e8f8 100%);
  color:var(--deep);
  padding:13px 18px;
  border-left:8px solid var(--yellow);
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  box-shadow:0 6px 16px rgba(0,0,0,0.3);
  animation:up 0.4s var(--snap) both;
  animation-delay:calc(0.12s + var(--i)*0.04s);
  border-radius:2px 12px 12px 2px;
}
.mode:active{transform:scale(0.98)}
.mode.drag{
  background:linear-gradient(135deg, #ff2d55 0%, #ff5e3a 100%);
  color:#fff;
  border-left-color:#fff;
  box-shadow:0 8px 24px rgba(255,45,85,0.4);
}
.mode.drag strong{color:#fff}
.mode.drag small{color:rgba(255,255,255,0.85)}
.mode.mix{
  background:linear-gradient(135deg, #ffc814 0%, #ff9e00 100%);
  border-left-color:var(--deep);
  padding:18px 18px;
  box-shadow:0 8px 24px rgba(255,160,0,0.4);
}
.mode strong{display:block;font:italic 800 24px/1.05 var(--display);letter-spacing:0.3px}
.mode.mix strong{font-size:31px}
.mode small{display:block;font-size:13px;color:rgba(10,15,45,0.75);margin-top:2px;font-weight:500}
.rec{font:italic 800 21px/1 var(--display);text-align:right;white-space:nowrap}
.rec small{font:600 11px var(--text);color:rgba(10,15,45,0.65);display:block;text-transform:uppercase;margin-top:2px}
.mode.drag .rec small{color:rgba(255,255,255,0.8)}

/* Верхняя панель во время игры */
.bar{
  position:absolute;
  top:0;left:0;right:0;
  z-index:15;
  display:flex;
  align-items:center;
  gap:10px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
.bar.flow{position:static;padding-left:0;padding-right:0;margin-bottom:6px}
.back{
  width:40px;
  height:40px;
  font-size:26px;
  display:grid;
  place-items:center;
  background:rgba(7,10,30,0.75);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:10px;
  backdrop-filter:blur(8px);
}
.back:active{transform:scale(0.9)}
.mt{flex:1;font:italic 800 21px/1 var(--display);text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.mt small{display:block;font:600 11px var(--text);color:rgba(255,255,255,0.8);margin-top:2px}

.lives{display:flex;gap:6px}
.lives i{
  display:inline-block;
  width:15px;
  height:15px;
  background:var(--yellow);
  transform:skewX(-20deg);
  border-radius:2px;
  box-shadow:0 0 10px var(--yellow-glow);
  transition:transform 0.35s var(--snap), background 0.35s;
}
.lives i.lost{
  background:rgba(255,255,255,0.2);
  transform:skewX(-20deg) scale(0.6);
  box-shadow:none;
}

/* Счёт и тахометр/комбо */
.meter{
  position:absolute;
  left:16px;right:64px;bottom:32px;
  z-index:15;
  display:flex;
  align-items:flex-end;
  gap:12px;
}
.meter.flow{position:static;margin:0 0 6px;padding:0}
.meter b{
  font:italic 900 66px/0.85 var(--display);
  text-shadow:0 4px 16px rgba(0,0,0,0.8);
  letter-spacing:-1px;
}
.meter b.pop{animation:scorePop 0.4s var(--snap)}
@keyframes scorePop{
  40%{transform:scale(1.35) rotate(-3deg);color:var(--yellow);text-shadow:0 0 25px var(--yellow)}
}
.tach{flex:1;display:flex;gap:4px;padding-bottom:6px}
.tach i{
  flex:1;
  height:10px;
  background:rgba(255,255,255,0.2);
  transform:skewX(-20deg);
  border-radius:1px;
  transition:background 0.25s, box-shadow 0.25s;
}
.tach i.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow-glow)}
.tach i.on.hot{background:var(--red);box-shadow:0 0 10px var(--red-glow)}
.tach i.fire{animation:flame 0.4s infinite alternate}
@keyframes flame{
  from{transform:skewX(-20deg) scaleY(1)}
  to{transform:skewX(-20deg) scaleY(1.4);filter:brightness(1.3)}
}

.combo-badge{
  position:absolute;
  right:16px;
  top:calc(env(safe-area-inset-top,0px) + 60px);
  z-index:20;
  background:linear-gradient(135deg, #ff416c, #ff4b2b);
  color:#fff;
  font:italic 900 15px/1 var(--display);
  padding:5px 12px;
  border-radius:20px;
  box-shadow:0 4px 16px rgba(255,75,43,0.5);
  animation:up 0.3s var(--snap) both;
  pointer-events:none;
}

/* Фото автомобиля в викторине */
.shot{
  position:relative;
  margin:0 -16px;
  height:calc(env(safe-area-inset-top, 0px) + min(68vw, 350px));
  background:#090d24;
  overflow:hidden;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 24px), calc(100% - 46px) 100%, 0 100%);
  box-shadow:0 10px 28px rgba(0,0,0,0.6);
}
.shot.sk{
  background:linear-gradient(100deg, #090d24 25%, #223282 50%, #090d24 75%) 0 0/250% 100%;
  animation:shimmer 1.2s linear infinite;
}
@keyframes shimmer{to{background-position:-250% 0}}
.shot img, .dcard img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 55%;
  animation:imgFade 0.6s ease-out both;
}
@keyframes imgFade{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.shot img.contain{object-fit:contain}
.bgb{
  position:absolute;
  inset:-24px;
  background-size:cover;
  background-position:center;
  filter:blur(22px) brightness(0.6);
}
.shot::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(rgba(7,10,30,0.65) 0%, transparent 28%, transparent 55%, rgba(7,10,30,0.92) 100%);
}

.fx-flash{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none}
.shot.win .fx-flash{background:radial-gradient(circle, var(--green-glow) 0%, transparent 70%);animation:flash 0.6s ease-out}
.shot.lose .fx-flash{background:radial-gradient(circle, var(--red-glow) 0%, transparent 70%);animation:flash 0.6s ease-out}
@keyframes flash{0%{opacity:0.9}100%{opacity:0}}

.cap{
  position:absolute;
  left:16px;right:16px;bottom:94px;
  z-index:15;
  font:italic 800 27px/1.05 var(--display);
  text-shadow:0 2px 14px rgba(0,0,0,0.85);
  animation:up 0.38s ease-out both;
}
.cap small{
  display:block;
  font:500 13px/1.4 var(--text);
  color:rgba(255,255,255,0.88);
  margin-top:4px;
}
.cap a{color:inherit;text-decoration:underline}

.q{
  font:italic 900 27px/1.12 var(--display);
  letter-spacing:0.3px;
  margin:4px 0 2px;
  animation:up 0.4s 0.06s ease-out both;
}
.q small{
  display:block;
  font:500 13.5px var(--text);
  color:rgba(255,255,255,0.7);
  margin-top:3px;
  letter-spacing:0;
}

/* Карточка факта («Знал ли ты?») */
.fact-card{
  background:linear-gradient(135deg, rgba(255,183,0,0.12), rgba(255,183,0,0.03));
  border:1px solid rgba(255,183,0,0.3);
  border-left:5px solid var(--yellow);
  padding:12px 16px;
  border-radius:10px;
  font-size:13.5px;
  line-height:1.45;
  color:rgba(255,255,255,0.92);
  margin:10px 0 4px;
  animation:up 0.4s both;
}
.fact-card b{
  color:var(--yellow);
  display:block;
  font:italic 800 14.5px var(--display);
  margin-bottom:3px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

/* Варианты ответов */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  position:relative;
  background:linear-gradient(135deg, rgba(255,255,255,0.98) 0%, #e9edfa 100%);
  color:var(--deep);
  text-align:left;
  padding:14px 18px;
  font-size:17.5px;
  font-weight:700;
  border-left:7px solid var(--yellow);
  border-radius:2px 12px 12px 2px;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  animation:up 0.38s ease-out both;
  animation-delay:calc(0.08s + var(--i)*0.05s);
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
  transition:transform 0.12s, opacity 0.25s, background 0.25s;
}
.opt:hover{transform:translateX(4px)}
.opt:active{transform:scale(0.98)}
.opt.ok{
  background:linear-gradient(135deg, #10b981 0%, #059669 100%);
  color:#fff;
  border-left-color:#fff;
  box-shadow:0 0 22px var(--green-glow);
}
.opt.bad{
  background:linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
  color:#fff;
  border-left-color:#fff;
  box-shadow:0 0 22px var(--red-glow);
}
.opt.dim{opacity:0.42;transform:none}

/* Дуэль (Что мощнее / Кто дороже) */
.duel-wrap{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.vs-divider{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  z-index:15;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg, #ffb700, #ff5100);
  color:#fff;
  display:grid;
  place-items:center;
  font:italic 900 16px/1 var(--display);
  box-shadow:0 0 16px rgba(255,183,0,0.7), 0 4px 10px rgba(0,0,0,0.5);
  border:3px solid var(--deep);
  pointer-events:none;
}
.dcard{
  position:relative;
  display:block;
  width:100%;
  height:clamp(145px, 24dvh, 205px);
  overflow:hidden;
  background:linear-gradient(125deg, #1b266d 0%, #0d1238 100%);
  border-radius:4px 16px 16px 4px;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  box-shadow:0 8px 24px rgba(0,0,0,0.45);
  animation:up 0.45s ease-out both;
  animation-delay:calc(0.08s + var(--i)*0.08s);
  transition:transform 0.15s, opacity 0.3s;
}
.dcard:active{transform:scale(0.985)}
.dcard::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(rgba(7,10,30,0.15) 20%, rgba(7,10,30,0.92) 90%);
}
.dcard .edge{
  position:absolute;
  left:0;top:0;bottom:0;
  width:9px;
  background:var(--yellow);
  z-index:5;
  transition:background 0.3s;
}
.dcard.ok .edge{background:var(--green);box-shadow:0 0 16px var(--green-glow)}
.dcard.bad .edge{background:var(--red);box-shadow:0 0 16px var(--red-glow)}
.dcard.dim{opacity:0.5}

.dcard .info{
  position:absolute;
  left:22px;right:18px;bottom:14px;
  z-index:6;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.dcard .nm{
  font:italic 900 24px/1.02 var(--display);
  text-shadow:0 2px 12px rgba(0,0,0,0.8);
}
.dcard .vr{
  display:block;
  font:500 13px var(--text);
  color:rgba(255,255,255,0.85);
  margin-top:3px;
}
.dcard .hp{
  font:italic 900 32px/1 var(--display);
  white-space:nowrap;
  color:var(--yellow);
}
.dcard.ok .hp{color:#4ade80}
.dcard.bad .hp{color:#f87171}
.dcard .hp small{
  font:600 13px var(--text);
  color:rgba(255,255,255,0.8);
  margin-left:4px;
}
.dcard .fill{
  position:absolute;
  left:0;bottom:0;
  height:7px;
  width:0;
  background:var(--yellow);
  z-index:7;
  transition:width 1s cubic-bezier(0.18, 0.9, 0.25, 1);
}
.dcard.ok .fill{background:var(--green);box-shadow:0 0 12px var(--green-glow)}
.dcard.bad .fill{background:var(--red);box-shadow:0 0 12px var(--red-glow)}

/* Интерактивный режим Драг-рейсинга */
.drag-arena{
  position:relative;
  background:#090d22;
  border-radius:14px;
  padding:14px;
  border:1.5px solid rgba(255,255,255,0.12);
  margin-top:8px;
  overflow:hidden;
}
.drag-tree{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:8px 0 14px;
  background:rgba(0,0,0,0.35);
  border-radius:10px;
  margin-bottom:12px;
}
.tree-light{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#1a1d33;
  border:2px solid rgba(255,255,255,0.25);
  transition:background 0.15s, box-shadow 0.15s;
}
.tree-light.stage.on{background:#00e5ff;box-shadow:0 0 16px var(--cyan)}
.tree-light.yellow.on{background:#ffb700;box-shadow:0 0 16px var(--yellow)}
.tree-light.green.on{background:#10b981;box-shadow:0 0 20px #10b981}

.drag-strip{
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
  background:#12162b;
  padding:16px 12px;
  border-radius:10px;
  border:1px dashed rgba(255,255,255,0.2);
}
.drag-lane{
  position:relative;
  height:56px;
  background:repeating-linear-gradient(90deg, #1b203d 0 20px, #161a33 20px 40px);
  border-radius:8px;
  display:flex;
  align-items:center;
  padding:0 8px;
  overflow:hidden;
}
.finish-line{
  position:absolute;
  right:16px;
  top:0;bottom:0;
  width:8px;
  background:repeating-linear-gradient(0deg, #fff 0 8px, #000 8px 16px);
  z-index:2;
}
.drag-car-sprite{

  height:38px;

  align-items:center;
  gap:8px;

  margin-top:12px;

  color:var(--yellow);

}

}
.read.ok{color:#4ade80}
.read.bad{color:#fb7185}
.rw{position:relative;padding:36px 4px 10px}
.rng{
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:100%;
  height:16px;
  margin:0;
  background:linear-gradient(90deg, var(--yellow) var(--p,50%), rgba(255,255,255,0.18) var(--p,50%));
  transform:skewX(-20deg);
  border-radius:3px;
  cursor:ew-resize;
}
.rng::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:32px;
  height:44px;
  background:linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
  border:0;
  border-left:8px solid var(--deep);
  box-shadow:0 4px 16px rgba(0,0,0,0.6);
  border-radius:2px;
}
.rng::-moz-range-thumb{
  width:26px;
  height:44px;
  background:#fff;
  border:0;
  border-left:8px solid var(--deep);
  box-shadow:0 4px 16px rgba(0,0,0,0.6);
}
.lh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);padding:6px 2px 0}
.mark{position:absolute;top:2px;left:calc(16px + (100% - 32px)*var(--m));width:0;height:60px;animation:fadeIn 0.35s both;z-index:8}
.mark::before{content:"";position:absolute;left:-2px;top:20px;bottom:0;width:4px;background:var(--green)}
.mark span{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;background:var(--green);color:#fff;font:italic 800 16px/1 var(--display);padding:3px 9px;border-radius:4px}

.fb{
  margin:10px 0 0;
  font-size:15.5px;
  line-height:1.45;
  background:rgba(255,255,255,0.06);
  padding:12px 16px;
  border-radius:10px;
  border-left:4px solid var(--yellow);
  animation:up 0.35s both;
}
.nextbar{
  position:sticky;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);
  margin-top:auto;
  padding-top:8px;
  animation:up 0.35s ease-out both;
  z-index:25;
}
.next{
  width:100%;

  text-align:center;

}
.next:active{transform:scale(0.98)}

/* Модальные окна */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(5,7,22,0.88);
  backdrop-filter:blur(10px);
  z-index:200;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  animation:fadeIn 0.25s both;
}
.modal-window{
  background:linear-gradient(180deg, #141b44 0%, #0a0e28 100%);

  max-height:90dvh;
  border-radius:24px 24px 0 0;

  overflow:hidden;
  animation:up 0.35s var(--snap) both;
}
.modal-head{
  display:flex;

  padding:18px 20px 14px;

}
.modal-head h3{
  font:italic 900 26px/1 var(--display);
  color:var(--yellow);
}
.modal-close{
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  display:grid;
  place-items:center;
  font-size:18px;
}
.modal-body{
  padding:16px 20px 30px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;

}

.garage-grid{

  gap:10px;
}
.car-card{

  transition:all 0.2s;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.car-card.locked{
  opacity:0.4;
  cursor:default;
  background:rgba(0,0,0,0.3);
}
.car-card .c-name{
  font:italic 800 16px/1.15 var(--display);
  color:#fff;
}
.car-card .c-meta{
  font-size:12px;
  color:var(--yellow);
  font-weight:600;
}

.specs-table{
  width:100%;
  border-collapse:collapse;
  margin-top:6px;
  font-size:13.5px;
}
.specs-table td{
  padding:8px 6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.specs-table td:first-child{color:rgba(255,255,255,0.6)}
.specs-table td:last-child{text-align:right;font-weight:700;color:var(--yellow)}

/* Список достижений */
.achieve-item{
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:12px 14px;
  border-radius:12px;
}
.achieve-item.done{
  border-color:rgba(255,183,0,0.4);
  background:linear-gradient(135deg, rgba(255,183,0,0.1), rgba(255,183,0,0.02));
}
.achieve-icon{
  font-size:28px;
  width:44px;
  height:44px;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.achieve-info strong{
  font:italic 800 18px/1.1 var(--display);
  display:block;
  color:#fff;
}
.achieve-item.done strong{color:var(--yellow)}
.achieve-info small{font-size:12.5px;color:rgba(255,255,255,0.7);display:block;margin-top:2px}

.toast-notice{
  position:fixed;
  top:calc(env(safe-area-inset-top, 0px) + 16px);

  color:var(--deep);

  border-radius:30px;
  display:flex;
  align-items:center;
  gap:10px;
  font:italic 900 16px var(--display);
  box-shadow:0 6px 25px rgba(255,183,0,0.6);
  z-index:1000;
  animation:toastPop 3.2s ease forwards;
  pointer-events:none;
}
@keyframes toastPop{
  0%{opacity:0;transform:translate(-50%, -20px) scale(0.9)}
  15%,80%{opacity:1;transform:translate(-50%, 0) scale(1)}
  100%{opacity:0;transform:translate(-50%, -20px) scale(0.9)}
}

.over{
  position:relative;
  text-align:center;
  padding-top:calc(env(safe-area-inset-top, 0px) + 36px);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.over h2{
  font:italic 900 48px/1 var(--display);
  color:var(--yellow);
  margin:0;
  text-shadow:0 4px 18px var(--yellow-glow);
  animation:up 0.45s both;
}
.over-rank{
  display:inline-block;
  margin:0 auto;
  background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.2);
  padding:6px 18px;
  border-radius:20px;
  font:italic 800 18px/1.2 var(--display);
  color:var(--cyan);
  animation:up 0.45s 0.08s both;
}
.over .big{font:italic 900 130px/0.9 var(--display);animation:up 0.5s 0.12s both}
.over p{margin:0;font-size:18px;color:rgba(255,255,255,0.85);animation:up 0.5s 0.18s both}
.ghost{
  background:rgba(255,255,255,0.1);
  text-align:center;
  padding:14px;
  font-size:17px;
  font-weight:700;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
}
.ghost:active{transform:scale(0.98)}

.copy-share-btn{
  background:linear-gradient(135deg, var(--cyan), #00a2ff);
  color:var(--deep);
  font:italic 900 18px var(--display);
  padding:14px;
  border-radius:10px;
  margin-top:6px;
}

/* ==========================================================================
   НОВЫЙ РАЗДЕЛ ПДД: РАЗДЕЛЬНЫЕ КАТЕГОРИИ А И В + РЕАЛЬНЫЕ ФОТО
   ========================================================================== */
.main-nav-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:4px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  margin:4px 0 8px;
}
.main-tab-btn{
  padding:10px 8px;
  border-radius:10px;
  font:italic 800 15px/1 var(--display);
  color:rgba(255,255,255,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all 0.2s;
}
.main-tab-btn.active{
  background:linear-gradient(135deg, var(--yellow), #ff9100);
  color:var(--deep);
  box-shadow:0 4px 14px var(--yellow-glow);
}
.main-tab-btn.active.pdd-tab{
  background:linear-gradient(135deg, #00e5ff, #0088ff);

  box-shadow:0 4px 14px var(--cyan-glow);
}

/* Переключатель категорий А / В */
.pdd-cat-switcher{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:4px 0 10px;
}
.pdd-cat-tab{
  padding:12px 8px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.12);

  flex-direction:column;

}

}

}

}
.pdd-cat-tab.active-a strong{color:var(--yellow)}
.pdd-cat-tab.active-b{
  background:linear-gradient(135deg, rgba(0,229,255,0.22), rgba(0,229,255,0.06));
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(0,229,255,0.3);
}
.pdd-cat-tab.active-b strong{color:var(--cyan)}

// Загрузка полного банка билетов ПДД из открытого репозитория GitHub.
// Данные и изображения загружаются при первом открытии раздела ПДД; сам HTML остаётся лёгким.
let pddBankLoaded = false;
let pddBankLoading = null;
let pddBankLoadError = "";
const PDD_DATA_REPO = "https://github.com/etspring/pdd_russia";
const PDD_RAW_BASE = "https://raw.githubusercontent.com/etspring/pdd_russia/master/";

function pddExtractQuestions(value, out = []) {
  if (!value) return out;
  if (Array.isArray(value)) {
    for (const item of value) pddExtractQuestions(item, out);
  } else if (typeof value === "object") {
    if (typeof value.question === "string" && Array.isArray(value.answers)) out.push(value);
    else for (const v of Object.values(value)) {
      if (v && (Array.isArray(v) || typeof v === "object")) pddExtractQuestions(v, out);
    }
  }
  return out;
}

function pddNormalizeQuestion(raw, path) {
  const answers = Array.isArray(raw.answers) ? raw.answers : [];
  const ans = answers.findIndex(a => a && (a.is_correct === true || a.is_correct === 1 || a.is_correct === "true"));
  const rawImage = typeof raw.image === "string" ? raw.image : "";
  let img = "";
  if (rawImage && !/^https?:\/\//i.test(rawImage)) {
    const clean = rawImage.replace(/^\.\//, "").replace(/^\//, "");
    img = PDD_RAW_BASE + clean;
  } else if (rawImage) img = rawImage;
  const ticketMatch = String(raw.ticket_number || path || "").match(/(?:билет|ticket|b)[^0-9]*(\d+)/i) || String(path || "").match(/(?:^|\D)(\d+)(?:\D|$)/);
  return {
    cat: "B",
    ticket: ticketMatch ? Number(ticketMatch[1]) : 0,
    topic: Array.isArray(raw.topic) ? raw.topic.join(" · ") : (raw.topic || "ПДД"),
    q: raw.question,
    opts: answers.map(a => String(a.answer_text ?? a.text ?? "")),
    ans,
    rule: String(raw.answer_tip || raw.correct_answer || "Правильный ответ отмечен в билете."),
    img,
    caption: raw.question,
    _id: `${raw.ticket_number || ""}:${raw.title || ""}:${raw.id || raw.question}`
  };
}

async function loadPddBank() {
  if (pddBankLoaded) return true;
  if (pddBankLoading) return pddBankLoading;
  pddBankLoading = (async () => {
    try {
      // GitHub API сообщает точные пути файлов, чтобы не зависеть от названий отдельных билетов.
      const treeResponse = await fetch("https://api.github.com/repos/etspring/pdd_russia/git/trees/master?recursive=1", { cache: "no-cache" });
      if (!treeResponse.ok) throw new Error("GitHub API ответил " + treeResponse.status);
      const treeData = await treeResponse.json();
      if (!Array.isArray(treeData.tree)) throw new Error("Не удалось получить список файлов с билетами");
      let paths = treeData.tree
        .filter(x => x.type === "blob" && /^questions\//i.test(x.path) && /\.json$/i.test(x.path) && /tickets/i.test(x.path))
        .map(x => x.path);
      if (!paths.length) {
        paths = treeData.tree
          .filter(x => x.type === "blob" && /^questions\//i.test(x.path) && /\.json$/i.test(x.path) && /A[_-]?B/i.test(x.path))
          .map(x => x.path);
      }
      if (!paths.length) throw new Error("В репозитории не найдены JSON-файлы экзаменационных билетов");

      const allRaw = [];
      // Небольшими партиями, чтобы не создавать десятки одновременных запросов.
      for (let i = 0; i < paths.length; i += 8) {
        const batch = await Promise.all(paths.slice(i, i + 8).map(async path => {
          const response = await fetch(PDD_RAW_BASE + path, { cache: "no-cache" });
          if (!response.ok) return [];
          try { return pddExtractQuestions(await response.json()); } catch (_) { return []; }
        }));
        for (const group of batch) allRaw.push(...group);
      }

      const unique = new Map();
      for (const raw of allRaw) {
        const category = String(raw.ticket_category || "").toUpperCase().replace(/\s/g, "");
        // Для теории легкового автомобиля используем комплект A/B, не C/D.
        if (category && !/(^|[,;/])A?[,;/]?B($|[,;/])/.test(category) && category !== "A,B" && category !== "B,A" && category !== "A,B,M") continue;
        if (!raw.ticket_number || !Array.isArray(raw.answers) || !raw.answers.length) continue;
        const normalized = pddNormalizeQuestion(raw, "");
        if (normalized.ans < 0 || !normalized.opts.length || !normalized.q) continue;
        unique.set(normalized._id, normalized);
      }
      const bank = Array.from(unique.values());
      if (bank.length < 800) throw new Error(`Загружено только ${bank.length} вопросов — ожидалось 800. Проверь подключение или доступность источника.`);
      PDD_BANK = { A: bank.map(q => ({...q, cat:"A"})), B: bank.map(q => ({...q, cat:"B"})) };
      pddBankLoaded = true;
      pddBankLoadError = "";
      return true;
    } catch (err) {
      console.error("Не удалось загрузить билеты ПДД:", err);
      pddBankLoadError = err && err.message ? err.message : "Неизвестная ошибка загрузки";
      return false;
    } finally {
      pddBankLoading = null;
    }
  })();
  return pddBankLoading;
}

const Sound = (() => {
  let ctx = null;
  let muted = store.get("tacho_muted", false);

  function getCtx(){
    if(!ctx){
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx) ctx = new AudioCtx();
    }
    if(ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  return {
    isMuted: () => muted,
    toggle: () => {
      muted = !muted;
      store.set("tacho_muted", muted);
      return muted;
    },
    click: () => {
      if(muted) return;
      const c = getCtx(); if(!c) return;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(540, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, c.currentTime + 0.04);
      g.gain.setValueAtTime(0.09, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.04);
      osc.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + 0.05);
    },
    rev: () => {
      if(muted) return;
      const c = getCtx(); if(!c) return;
      const t = c.currentTime;
      const osc = c.createOscillator();
      const flt = c.createBiquadFilter();
      const g = c.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(80, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.35);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.7);

      flt.type = "lowpass";
      flt.frequency.setValueAtTime(350, t);
      flt.frequency.exponentialRampToValueAtTime(1400, t + 0.35);
      flt.frequency.exponentialRampToValueAtTime(450, t + 0.7);

      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.15, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);

      osc.connect(flt); flt.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(t + 0.78);
    },
    beepYellow: () => {
      if(muted) return;
      const c = getCtx(); if(!c) return;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(650, c.currentTime);
      g.gain.setValueAtTime(0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.15);
      osc.connect(g); g.connect(c.destination);

      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
      osc.connect(g); g.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + 0.42);
    },
    screech: () => {
      if(muted) return;
      const c = getCtx(); if(!c) return;
      const t = c.currentTime;
      const osc = c.createOscillator();

function resizeBg(){

function renderBg(){

const particles = [];
function addSparks(cx, cy, count = 26, colors = ["#ffb700", "#10b981", "#00e5ff", "#ffffff"]){
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6.5;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1.5,
      sz: 3 + Math.random() * 3.5,
      col: colors[rnd(colors.length)],
      life: 1,
      decay: 0.02 + Math.random() * 0.025
    });
  }
}

function renderFx(){
  fxCtx.clearRect(0, 0, fxW, fxH);
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.14;
    p.life -= p.decay;
    if(p.life <= 0){
      particles.splice(i, 1);
      continue;
    }
    fxCtx.fillStyle = p.col;
    fxCtx.globalAlpha = p.life;
    fxCtx.beginPath();
    fxCtx.arc(p.x, p.y, p.sz * p.life, 0, Math.PI * 2);
    fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;
  requestAnimationFrame(renderFx);
}
requestAnimationFrame(renderFx);

const N = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const BAD = /logo|badge|emblem|icon|interior|dashboard|cockpit|engine|wheel|seat|steering|gauge|speedo|diagram|drawing|blueprint|map|chassis|cutaway|schematic|light|detail|console|trunk|boot|crash|wreck|poster|portrait|toy|lego|scale|miniature|screenshot|render|sketch/i;
const API = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1280&gsrsearch=";

async function jget(u){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 9500);
  try{
    const r = await fetch(u, {signal: c.signal});
    if(!r.ok) throw 0;
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

async function getCands(car){
  if(car.cands) return car.cands;
  const ck = "c5:" + car.name, c = store.get(ck, null);
  if(c && Date.now() - c.t < 6048e5){
    car.cands = c.l;
    car.bad = !c.l.length;
    return c.l;
  }
  const first = t => t.split("|")[0];
  const q = car.name + " " + car.k.filter(t => !N(car.name).includes(N(first(t)))).map(first).join(" ");
  const j = await jget(API + encodeURIComponent(q));
  const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
  pages.sort((a,b) => a.index - b.index);
  const l = [];
  for(const p of pages){
    const ii = p.imageinfo && p.imageinfo[0];
    if(!ii || ii.mime !== "image/jpeg" || ii.width < 900) continue;
    const r = ii.width / ii.height;
    if(r < 1.25 || r > 2.45) continue;
    const t = p.title.replace(/^File:/, ""), f = N(t);
    if(BAD.test(t) || (car.x && car.x.test(f))) continue;
    if(!car.k.every(k => k.split("|").some(a => f.includes(a)))) continue;
    l.push({
      u: ii.thumburl || ii.url,
      page: ii.descriptionurl || "https://commons.wikimedia.org/wiki/" + encodeURIComponent(p.title)
    });
    if(l.length >= 10) break;
  }
  car.cands = l;
  car.bad = !l.length;
  store.set(ck, {t: Date.now(), l});
  return l;
}

const loadImg = u => new Promise(r => {
  const i = new Image();
  let d = 0;
  const f = v => { if(!d){ d = 1; r(v); } };
  i.decoding = "async";
  i.onload = () => f({u, w: i.naturalWidth, h: i.naturalHeight});
  i.onerror = () => f(null);
  setTimeout(() => f(null), 9500);
  i.src = u;
});

async function photoFor(s, car){
  let l;
  try{ l = await getCands(car); } catch(e){ return null; }
  const fresh = l.filter(c => !s.used.has(c.u));
  for(const c of (fresh.length ? shuffle(fresh) : shuffle(l)).slice(0, 3)){
    for(const u of [c.u, c.u.replace(/\/\d+px-/, "/960px-")]){
      const r = await loadImg(u);
      if(r && r.w >= 600){
        if(s.used.size > 90) s.used.clear();
        s.used.add(c.u);
        return {src: r.u, w: r.w, h: r.h, page: c.page};
      }
    }
  }
  return null;
}

   ГЕНЕРАТОР ВОПРОСОВ АВТОВИКТОРИНЫ
   ========================================================================== */
let activePack = store.get("tacho_pack", "all");

function getFilteredPool(){
  if(activePack === "all") return CARS;
  return CARS.filter(c => c.tags.includes(activePack));
}

function pick(s, pool, any){
  const rc = s.recent.slice(-10), ok = pool.filter(c => any || !c.bad), free = ok.filter(c => !rc.includes(c));
  const src = free.length ? free : ok;
  return src[rnd(src.length)];
}

async function duel(s, kind){
  const f = kind === "power" ? "hp" : (kind === "drag" ? "acc" : "p");
  const basePool = getFilteredPool();
  const pool = f === "p" ? basePool.filter(c => c.p) : basePool;
  if(pool.length < 2) return null;

  for(let i = 0; i < 40; i++){
    const a = pick(s, pool, 1), b = pick(s, pool, 1);
    if(a === b) continue;
    if(kind !== "drag" && Math.abs(a[f] - b[f]) / Math.max(a[f], b[f]) < 0.05) continue;
    if(kind === "drag" && Math.abs(a.acc - b.acc) < 0.15) continue;

    s.recent.push(a, b);
    const ph = await Promise.all([photoFor(s, a), photoFor(s, b)]);
    if(!ph[0] || !ph[1]) continue;

    const ans = kind === "drag" ? (a.acc < b.acc ? 0 : 1) : (a[f] > b[f] ? 0 : 1);
    return {kind, f, items: [a, b], ph, ans};
  }
  return null;
}

async function makeQ(s){
  let kind = s.mode === "mix" ? MIXK[rnd(MIXK.length)] : s.mode;
  if(kind === "power" || kind === "rich" || kind === "drag") return duel(s, kind);

  const basePool = getFilteredPool();
  const pool = kind === "gc" ? basePool.filter(c => c.p) : basePool;
  for(let i = 0; i < 8; i++){
    const car = pick(s, pool);
    if(!car) break;
    const ph = await photoFor(s, car);
    if(!ph) continue;
    s.recent.push(car);
    if(kind === "gp" || kind === "gc") return {kind, car, ph};
    let labels, ans;
    if(kind === "brand"){
      labels = shuffle([car.b, ...sample(BRANDS, 3, [car.b])]);
      ans = labels.indexOf(car.b);
    } else {
      const o = shuffle([car, ...sample(basePool.length >= 4 ? basePool : CARS, 3, [car])]);
      labels = o.map(c => c.name);
      ans = o.indexOf(car);
    }
    return {kind, car, ph, labels, ans};
  }
  return null;
}

function getTodayDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDailySeed(){
  const s = getTodayDateStr();
  let h = 0;
  for(let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
  return Math.abs(h);
}

function getDailyCars(){
  let seed = getDailySeed();
  const pool = CARS.slice();
  const res = [];
  for(let i = 0; i < 5; i++){
    seed = (seed * 9301 + 49297) % 233280;
    const idx = Math.floor((seed / 233280) * pool.length);
    res.push(pool.splice(idx, 1)[0]);
  }
  return res;
}

/* ==========================================================================
   ИГРОВАЯ МЕХАНИКА ВИКТОРИНЫ
   ========================================================================== */
function start(mode){
  token++;
  S = {
    mode,
    score: 0,
    streak: 0,
    lives: 3,
    q: null,
    pre: null,
    recent: [],
    used: new Set(),
    locked: false,
    newBest: false
  };
  next();
}

function startDaily(){
  token++;
  const dailyCars = getDailyCars();
  S = {
    mode: "daily",
    score: 0,
    streak: 0,
    lives: 5,
    q: null,
    pre: null,
    recent: [],
    used: new Set(),
    locked: false,
    dailyStep: 0,
    dailyCars,
    dailyResults: []
  };
  next();
}

async function makeDailyQ(s){
  if(!s || s.dailyStep >= s.dailyCars.length) return null;
  const car = s.dailyCars[s.dailyStep];
  const ph = await photoFor(s, car);
  if(!ph) return null;
  const basePool = CARS;
  const o = shuffle([car, ...sample(basePool, 3, [car])]);
  const labels = o.map(c => c.name);
  const ans = o.indexOf(car);
  return {kind: "model", car, ph, labels, ans};
}

const barH = () => {
  const modeTitle = S.mode === "daily" ? "Автомобиль Дня" : (MODES[S.mode]?.t || "Гонка");
  const recordTxt = S.mode === "daily" ? `Этап ${S.dailyStep + 1} из 5` : `рекорд ${Math.max(best(S.mode), S.score)}`;
  const livesCount = S.mode === "daily" ? 5 : 3;
  const livesHtml = Array.from({length: livesCount}, (_, i) => `<i class="${i < S.lives ? "" : "lost"}"></i>`).join("");
  return `
    <button class="back" data-act="menu" aria-label="В меню">‹</button>
    <div class="mt">${modeTitle}<small>${recordTxt}</small></div>
    <div class="lives" role="img" aria-label="Жизней: ${S.lives}">${livesHtml}</div>
  `;
};

const meterH = () => {
  const lit = S.streak ? ((S.streak - 1) % 10) + 1 : 0;
  let g = "";
  for(let i = 0; i < 10; i++){
    g += `<i class="${i < lit ? "on" : ""}${i >= 8 ? " hot" : ""}${i === lit - 1 ? " fire" : ""}"></i>`;
  }
  return `
    <b>${S.score}</b>
    <div class="tach" aria-hidden="true">${g}</div>
    ${S.streak >= 3 ? `<div class="combo-badge">🔥 x${S.streak}</div>` : ""}
  `;
};

async function go(){
  if(!S) return;
  app.classList.add("leave");
  await sleep(170);
  app.classList.remove("leave");
  next();
}

async function next(){
  const s = S, t = token;
  app.innerHTML = `
    <div class="shot sk">
      <div class="bar" id="bar">${barH()}</div>
      <div class="meter" id="meter">${meterH()}</div>
    </div>
  `;
  let q = s.pre ? await s.pre : null;
  s.pre = null;
  if(!q){
    q = s.mode === "daily" ? await makeDailyQ(s) : await makeQ(s);
  }
  if(t !== token) return;
  if(!q){
    app.innerHTML = `
      <div class="bar flow" id="bar">${barH()}</div>
      <div class="err" style="background:rgba(255,255,255,0.06);padding:18px;border-radius:12px;margin-top:14px">
        Не удалось загрузить фотографии с серверов Wikimedia. Проверьте подключение к интернету.
      </div>
      <div class="nextbar">
        <button class="next" data-act="retry">Повторить</button>
      </div>
    `;
    return;
  }
  s.q = q;
  s.locked = false;
  renderQ();
  if(s.mode !== "daily"){
    s.pre = makeQ(s);
  }
}

function countUp(el, to, fmt){
  if(!el) return;
  fmt = fmt || (v => v);
  const t0 = performance.now();
  (function f(t){
    const p = Math.min(1, (t - t0) / 900);
    el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if(p < 1) requestAnimationFrame(f);
  })(t0);
}

function settle(ok){
  const s = S;
  if(ok){
    s.score++;
    s.streak++;
    Meta.addXP(20 + Math.min(s.streak * 5, 50));
    Sound.correct();
    vibrate([40, 20]);
    addSparks(window.innerWidth / 2, 220, 25);
    if(s.mode !== "daily" && s.score > best(s.mode)){
      setBest(s.mode, s.score);
      s.newBest = true;
    }
    if(s.streak >= 5) Meta.checkAchieve("streak_5", true);
    if(s.streak >= 10) Meta.checkAchieve("streak_10", true);
    Meta.checkAchieve("first_win", true);
    if(s.q && s.q.car) Meta.unlockCar(s.q.car.id);
  } else {
    s.lives--;
    s.streak = 0;
    Sound.wrong();
    vibrate([80, 40, 80]);
    app.classList.add("shake");
    setTimeout(() => app.classList.remove("shake"), 380);
  }
  const barEl = $("bar"); if(barEl) barEl.innerHTML = barH();
  const metEl = $("meter"); if(metEl) metEl.innerHTML = meterH();
  const meterB = document.querySelector("#meter b");
  if(ok && meterB) meterB.classList.add("pop");
  return ok && s.streak % 5 === 0 ? "🔥 Серия ×" + s.streak : "";
}

function reveal(ok, q, st, extra){
  const shotEl = $("shot");
  if(shotEl) shotEl.classList.add(ok ? "win" : "lose");
  const credit = q.ph && q.ph.page ? `<a href="${esc(q.ph.page)}" target="_blank" rel="noopener">Фото: Wikimedia</a>` : "";
  const capEl = $("cap");
  if(capEl && q.car){
    capEl.innerHTML = `
      ${ok ? "✓ Верно!" : "✕ Ошибка!"} ${esc(q.car.name)}
      <small>${[q.car.v, extra, st, credit].filter(Boolean).join(" · ")}</small>
    `;
  }
}

function finish(fb, fact){
  const s = S;
  const after = $("after");
  if(!after) return;
  const factHtml = fact ? `
    <div class="fact-card">
      <b>💡 Интересный факт</b>
      ${esc(fact)}
    </div>
  ` : "";
  const nextAct = s.mode === "daily" ? (s.dailyStep < 4 ? "next-daily" : "finish-daily") : (s.lives > 0 ? "next" : "over");
  const nextTxt = s.mode === "daily" ? (s.dailyStep < 4 ? "Следующее авто" : "Результаты дня") : (s.lives > 0 ? "Следующий заезд" : "Финиш гонки");

  after.innerHTML = `
    ${fb ? `<div class="fb">${fb}</div>` : ""}
    ${factHtml}
    <div class="nextbar">
      <button class="next" data-act="${nextAct}">${nextTxt}</button>
    </div>
  `;
}

function answer(i, e){
  const s = S;
  if(!s || s.locked || !s.q) return;
  s.locked = true;
  const q = s.q;
  const ok = i === q.ans;
  if(s.mode === "daily") s.dailyResults.push(ok);

  document.querySelectorAll("[data-i]").forEach(b => {
    const k = +b.dataset.i;
    b.classList.add(k === q.ans ? "ok" : (k === i ? "bad" : "dim"));
    b.setAttribute("aria-disabled", "true");
  });

  const st = settle(ok);

  if(q.items){
    const mx = Math.max(q.items[0][q.f], q.items[1][q.f]);
    document.querySelectorAll(".dcard").forEach((b, k) => {
      const valToShow = q.items[k][q.f];
      countUp(b.querySelector(".hp b"), valToShow, q.f === "p" ? grp : null);
      requestAnimationFrame(() => {
        const fill = b.querySelector(".fill");
        if(fill) fill.style.width = (valToShow / mx * 100) + "%";
      });
      if(k === q.ans) b.classList.add("ok");
      else if(k === i) b.classList.add("bad");
      else b.classList.add("dim");
    });
    const winnerCar = q.items[q.ans];
    if(ok) Meta.unlockCar(winnerCar.id);
    finish(ok ? "✓ Точно в цель!" : "✕ Не угадал!", winnerCar.fact);
  } else {
    reveal(ok, q, st, "");
    finish("", q.car?.fact);
  }
}

function check(e){
  const s = S;
  if(!s || s.locked || !s.q) return;
  s.locked = true;
  const q = s.q, g = G[q.kind], rng = $("rng");
  const guess = val(g, +rng.value);
  const real = q.car[g.f];
  const ok = Math.abs(guess - real) / real <= g.tol;
  rng.disabled = true;
  const rd = $("read");
  if(rd) rd.classList.add(ok ? "ok" : "bad");
  const st = settle(ok);
  const rw = $("rw");
  if(rw){
    rw.insertAdjacentHTML("afterbegin", `
      <i class="mark" style="--m:${Math.min(1, Math.max(0, pos(g, real) / 1000))}">
        <span>${g.fmt(real)}</span>
      </i>
    `);
  }
  const d = Math.round((guess - real) / real * 100);
  reveal(ok, q, st, "");
  const diffTxt = d === 0 ? "точь-в-точь!" : (d > 0 ? `перелёт на +${d}%` : `недолёт на ${d}%`);
  finish(
    `${ok ? "✓ Отличная оценка!" : "✕ Мимо!"} На самом деле: <b>${g.fmt(real)}</b> (${diffTxt}). Допуск: ±${Math.round(g.tol * 100)}%.`,
    q.car.fact
  );
}

async function startDragRace(choice){
  const s = S;
  if(!s || s.locked || !s.q) return;
  s.locked = true;
  const q = s.q;
  const [c1, c2] = q.items;
  const ok = choice === q.ans;
  const curToken = token;

  document.querySelectorAll("[data-drag-i]").forEach(b => {
    b.setAttribute("aria-disabled", "true");
    const idx = +b.dataset.dragI;
    if(idx === choice) b.style.outline = "2px solid var(--cyan)";
  });

  const stageLight = $("tl-stage");
  const y1Light = $("tl-y1");
  const y2Light = $("tl-y2");
  const grLight = $("tl-green");

  if(stageLight) stageLight.classList.add("on");
  Sound.beepYellow();
  await sleep(400);
  if(curToken !== token) return;

  if(y1Light) y1Light.classList.add("on");
  Sound.beepYellow();
  await sleep(400);
  if(curToken !== token) return;

  if(y2Light) y2Light.classList.add("on");
  Sound.beepYellow();
  await sleep(400);
  if(curToken !== token) return;

  if(grLight) grLight.classList.add("on");
  Sound.beepGreen();
  Sound.screech();
  Sound.rev();
  vibrate([60, 40, 150]);

  const sprite0 = $("car-sprite-0");
  const sprite1 = $("car-sprite-1");
  const stripWidth = sprite0?.parentElement?.clientWidth || 300;
  const dist = Math.max(stripWidth - 140, 120);

  const minAcc = Math.min(c1.acc, c2.acc);
  const dur0 = 1.0 + (c1.acc / minAcc - 1) * 1.5;
  const dur1 = 1.0 + (c2.acc / minAcc - 1) * 1.5;

  if(sprite0){
    sprite0.style.transition = `transform ${dur0}s cubic-bezier(0.2, 0.8, 0.25, 1)`;
    sprite0.style.transform = `translateX(${dist}px)`;
  }
  if(sprite1){
    sprite1.style.transition = `transform ${dur1}s cubic-bezier(0.2, 0.8, 0.25, 1)`;
    sprite1.style.transform = `translateX(${dist}px)`;
  }

  await sleep(Math.max(dur0, dur1) * 1000 + 150);
  if(curToken !== token) return;

  const t1 = $("time-c1"); if(t1) t1.textContent = `⚡ ${c1.acc}c`;
  const t2 = $("time-c2"); if(t2) t2.textContent = `⚡ ${c2.acc}c`;

  const banner = $("drag-winner");
  const winner = q.ans === 0 ? c1 : c2;
  if(banner){
    banner.style.display = "block";
    banner.textContent = `🏆 Победитель: ${winner.name} (${winner.acc} с 0–100)`;
  }

  document.querySelectorAll("[data-drag-i]").forEach(b => {
    const idx = +b.dataset.dragI;
    if(idx === q.ans) b.classList.add("ok");
    else if(idx === choice) b.classList.add("bad");
    else b.classList.add("dim");
  });

  const st = settle(ok);
  if(ok) Meta.checkAchieve("drag_king", true);
  Meta.unlockCar(winner.id);

  finish(
    ok ? `🔥 Верно! ${winner.name} быстрее на ${Math.abs(c1.acc - c2.acc).toFixed(2)} с!` : `✕ Не угадал! ${winner.name} вырвался вперёд.`,
    winner.fact
  );
}

   НОВАЯ ЛОГИКА ЭКЗАМЕНА И ТРЕНИРОВКИ ПДД (РАЗДЕЛЬНО А И В)
   ========================================================================== */
async function startPddSession(isExam = true, fixedTicket = null){
  Sound.click();
  vibrate(30);
  token++;

  if (!pddBankLoaded) {
    app.innerHTML = `<div class="user-panel"><button class="back" data-act="pdd-menu">‹</button><h2>Загружаю билеты ПДД…</h2><p class="sub">Получаю вопросы и официальные иллюстрации из открытой базы. Это может занять несколько секунд.</p><div class="loader" style="margin:24px auto"></div></div>`;
    const loaded = await loadPddBank();
    if (!loaded) {
      app.innerHTML = `<div class="user-panel"><button class="back" data-act="pdd-menu">‹</button><h2>Не удалось загрузить билеты</h2><p class="sub">${esc(pddBankLoadError || "Проверь подключение к интернету и попробуй ещё раз.")}</p><button class="mode" data-act="start-pdd-exam">Повторить загрузку</button></div>`;
      return;
    }
  }

  // Выбираем полный банк вопросов для активной категории (А или В)
  const categoryBank = PDD_BANK[pddCategory] || PDD_BANK.B;
  let pool = categoryBank.slice();

  if(fixedTicket !== null){
    const filtered = pool.filter(q => q.ticket === fixedTicket);
    if(filtered.length > 0) pool = filtered;
  }

  pool = shuffle(pool);

  const targetCount = isExam ? 20 : pool.length;
  const examQuestions = [];
  let poolCursor = 0;

  while(examQuestions.length < targetCount){
    if(poolCursor >= pool.length){
      pool = shuffle(categoryBank.slice());
      poolCursor = 0;
    }
    examQuestions.push(pool[poolCursor++]);
  }

  pddState = {
    isExam,
    category: pddCategory,
    questions: examQuestions,
    curIdx: 0,
    answers: new Array(examQuestions.length).fill(null),
    errors: 0,
    timeLeft: 20 * 60,
    timerId: null,
    locked: false
  };

  if(isExam){
    pddState.timerId = setInterval(() => {
      if(!pddState) return;
      pddState.timeLeft--;
      const tEl = $("pdd-timer-val");
      if(tEl){
        const m = Math.floor(Math.max(0, pddState.timeLeft) / 60);
        const s = Math.max(0, pddState.timeLeft) % 60;
        tEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
      if(pddState.timeLeft <= 0){
        clearInterval(pddState.timerId);
        finishPddExam();
      }
    }, 1000);
  }
  renderPddQuestion();
}

function renderPddQuestion(){
  const s = pddState;
  if(!s || s.curIdx >= s.questions.length){
    finishPddExam();
    return;
  }
  const q = s.questions[s.curIdx];

  const matrix = s.questions.map((_, i) => {
    let cls = "pdd-num";
    if(i === s.curIdx) cls += " cur";
    if(s.answers[i] === true) cls += " ok";
    if(s.answers[i] === false) cls += " bad";
    return `<div class="${cls}">${i+1}</div>`;
  }).join("");

  const m = Math.floor(s.timeLeft / 60);
  const sec = s.timeLeft % 60;
  const isCatA = s.category === "A";

  const trajHtml = q.trajectories ? `
    <div class="trajectory-overlay">
      ${q.trajectories.map(t => `
        <div class="traj-badge ${t.class}">
          ${esc(t.name)} <span>➔ ${esc(t.desc)}</span>
        </div>
      `).join("")}
    </div>
  ` : "";

  app.innerHTML = `
    <div class="user-panel" style="padding-bottom:2px">
      <button class="back" data-act="pdd-menu">‹</button>
      <div class="mt" style="font-size:18px">
        ${s.isExam ? `Экзамен ГИБДД (Кат. ${s.category})` : `Тренировка ПДД (Кат. ${s.category})`}
        <small>${q.topic} · Вопрос ${s.curIdx + 1} из ${s.questions.length}</small>
      </div>
      ${s.isExam ? `<div class="pdd-timer"><span id="pdd-timer-val">${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}</span></div>` : ""}
    </div>

    <div class="pdd-matrix">${matrix}</div>

    <!-- Реальная фотография ситуации с возможностью зума -->
    <div class="pdd-photo-container" data-zoom-photo="${esc(q.img)}" data-caption="${esc(q.caption || q.q)}" style="${q.img ? "" : "display:none"}">
      <span class="pdd-cat-tag ${isCatA ? "cat-a" : "cat-b"}">
        ${isCatA ? "🏍️ Категория А" : "🚗 Категория В"}
      </span>
      <span class="pdd-zoom-tip">🔍 Нажмите для фото</span>
      <img src="${esc(q.img)}" alt="Иллюстрация из билета ПДД" onerror="this.closest('.pdd-photo-container').style.display='none'">
      ${trajHtml}
    </div>

    <p class="q" style="font-size:19.5px;line-height:1.25;margin:4px 0 8px">${esc(q.q)}</p>

    <div class="opts">
      ${q.opts.map((optText, i) => `
        <button class="opt" data-pdd-ans="${i}" style="font-size:15px;padding:12px 14px">
          ${esc(optText)}
        </button>
      `).join("")}
    </div>

    <div id="pdd-after"></div>
  `;
}

function answerPdd(idx){
  const s = pddState;
  if(!s || s.locked) return;
  s.locked = true;
  const q = s.questions[s.curIdx];
  const isOk = idx === q.ans;
  s.answers[s.curIdx] = isOk;
  if(!isOk) s.errors++;

  document.querySelectorAll("[data-pdd-ans]").forEach((b, k) => {
    b.setAttribute("aria-disabled", "true");
    if(k === q.ans) b.classList.add("ok");
    else if(k === idx) b.classList.add("bad");
    else b.classList.add("dim");
  });

  if(isOk){
    Sound.correct();
    vibrate([40, 20]);
    addSparks(window.innerWidth/2, 260, 20);
    Meta.addXP(15);
  } else {
    Sound.wrong();
    vibrate([100, 50, 100]);
    app.classList.add("shake");
    setTimeout(() => app.classList.remove("shake"), 350);
  }

  const after = $("pdd-after");
  if(after){
    after.innerHTML = `
      <div class="pdd-explain-box">
        <strong>${isOk ? "✓ Верно!" : "✕ Ошибка!"} Пояснение Правил Дорожного Движения:</strong>
        ${esc(q.rule)}
      </div>
      <div class="nextbar">
        <button class="next" data-act="pdd-next">
          ${s.curIdx < s.questions.length - 1 ? "Следующий вопрос" : "Итоги экзамена"}
        </button>
      </div>
    `;
  }
}

function finishPddExam(){
  if(pddState && pddState.timerId){
    clearInterval(pddState.timerId);
  }
  const s = pddState;
  const total = s.questions.length;
  const errors = s.errors;
  const isPassed = errors <= 2;
  const isCatA = s.category === "A";

  const passedKey = isCatA ? "tacho_pdd_passed_a" : "tacho_pdd_passed_b";
  const totalKey = isCatA ? "tacho_pdd_total_a" : "tacho_pdd_total_b";

  if(isPassed){
    Sound.fanfare();
    vibrate([80, 40, 120]);
    Meta.addXP(120);
    Meta.checkAchieve(isCatA ? "pdd_a_pass" : "pdd_b_pass", true);
    store.set(passedKey, store.get(passedKey, 0) + 1);
  } else {
    Sound.wrong();
  }
  store.set(totalKey, store.get(totalKey, 0) + 1);

  app.innerHTML = `
    <div class="over">
      <h2>${isPassed ? "ЭКЗАМЕН СДАН!" : "НЕ СДАНО"}</h2>
      <div class="over-rank" style="color:${isPassed ? "var(--green)" : "var(--red)"}">
        ${isPassed ? `Поздравляем! Категория ${s.category} подтверждена` : "Превышен лимит ошибок (максимум 2)"}
      </div>
      <div class="big" style="color:${isPassed ? "var(--green)" : "var(--red)"}">
        ${total - errors}/${total}
      </div>
      <p>Ошибок: <b>${errors}</b> из ${total}</p>
      <div class="nextbar" style="position:static">
        <button class="next" data-act="start-pdd-exam">Повторить экзамен</button>
      </div>
      <button class="ghost" data-act="pdd-menu">В меню ПДД</button>
    </div>
  `;
}

document.body.addEventListener("click", e => {
  // Закрытие Lightbox полноэкранного фото
  if(e.target.closest("[data-close-lightbox]") || e.target.classList.contains("photo-lightbox")){
    const lb = $("active-lightbox");
    if(lb) lb.remove();
    return;
  }

  // Клик по фото вопроса для зума
  const zoomEl = e.target.closest("[data-zoom-photo]");
  if(zoomEl && !e.target.closest("[data-pdd-ans]")){
    openPhotoLightbox(zoomEl.dataset.zoomPhoto, zoomEl.dataset.caption);
    return;
  }

  // Закрытие модального окна
  if(e.target.closest("[data-close-modal]") || e.target.classList.contains("modal-overlay")){
    const m = $("active-modal");
    if(m) m.remove();
    return;
  }

  // Переключение главной вкладки (Викторина / ПДД)
  const tabBtn = e.target.closest("[data-switch-section]");
  if(tabBtn){
    appSection = tabBtn.dataset.switchSection;
    store.set("tacho_section", appSection);
    Sound.click();
    vibrate(25);
    menu();
    return;
  }

  // Переключение категории ПДД (Категория А / Категория В)
  const catBtn = e.target.closest("[data-set-pdd-cat]");
  if(catBtn){
    pddCategory = catBtn.dataset.setPddCat;
    store.set("tacho_pdd_category", pddCategory);
    Sound.click();
    vibrate(25);
    menu();
    return;
  }

  // Ответ на вопрос ПДД
  const pddAns = e.target.closest("[data-pdd-ans]");
  if(pddAns){
    answerPdd(+pddAns.dataset.pddAns);
    return;
  }

  const el = e.target.closest("[data-act],[data-mode],[data-i],[data-drag-i],[data-modal],[data-pack],[data-inspect],[data-set-skin],[data-copy]");
  if(!el) return;

  if(el.dataset.copy){
    const text = el.dataset.copy;
    const inp = document.createElement("textarea");
    inp.value = text;
    document.body.appendChild(inp);
    inp.select();
    try {
      document.execCommand('copy');
      Meta.toast("Результат скопирован в буфер!");
      vibrate(50);
    } catch(err){}
    inp.remove();
    return;
  }

  if(el.dataset.modal){
    openModal(el.dataset.modal);
    return;
  }

  if(el.dataset.inspect){
    const curM = $("active-modal");
    if(curM) curM.remove();
    openModal("inspect", +el.dataset.inspect);
    return;
  }

  if(el.dataset.setSkin){
    activeSkin = el.dataset.setSkin;
    store.set("tacho_skin", activeSkin);
    const curM = $("active-modal");
    if(curM) curM.remove();
    menu();
    return;
  }

  if(el.dataset.pack){
    activePack = el.dataset.pack;
    store.set("tacho_pack", activePack);
    Sound.click();
    vibrate(25);
    menu();
    return;
  }

  if(el.dataset.act){
    const a = el.dataset.act;
    if(a === "menu"){ Sound.click(); menu(); }
    else if(a === "pdd-menu"){
      if(pddState && pddState.timerId) clearInterval(pddState.timerId);
      Sound.click();
      menu();
    }
    else if(a === "start-pdd-exam"){ startPddSession(true, null); }
    else if(a === "start-pdd-ticket-1"){ startPddSession(true, 1); }
    else if(a === "start-pdd-marathon"){ startPddSession(false, null); }
    else if(a === "pdd-next"){
      if(pddState){
        pddState.curIdx++;
        pddState.locked = false;
        renderPddQuestion();
      }
    }
    else if(a === "next"){ Sound.click(); go(); }
    else if(a === "next-daily"){
      Sound.click();
      S.dailyStep++;
      go();
    }
    else if(a === "retry"){ Sound.click(); next(); }
    else if(a === "check"){ check(e); }
    else if(a === "over"){ over(); }
    else if(a === "again"){ start(S.mode); }
    else if(a === "start-daily"){ startDaily(); }
    else if(a === "finish-daily"){ finishDaily(); }
    else if(a === "toggle-sound"){
      const isMuted = Sound.toggle();
      el.textContent = isMuted ? "🔇 Включить звук" : "🔊 Выключить звук";
    }
  } else if(el.dataset.mode){
    start(el.dataset.mode);
  } else if(el.dataset.dragI !== undefined){
    startDragRace(+el.dataset.dragI);
  } else if(el.dataset.i !== undefined){
    answer(+el.dataset.i, e);
  }
});

menu();
</script>
</body>
</html>
